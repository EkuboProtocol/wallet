[package]
name = "ekubo-wallet-windows-owner-auth"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
license = "FSL-1.1-MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3.2"
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[[bin]]
name = "ekubo-wallet-v2-owner-auth"
path = "src/main.rs"

[lints]
workspace = true
