[package]
name = "walletconnect-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "WalletConnect v2 Sign session handling for EIP-155 wallets"
repository = "https://github.com/EkuboProtocol/wallet-mcp-server"
license = "FSL-1.1-MIT"
publish = false

[dependencies]
alloy-primitives = "1.6.1"
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.23.0"
bs58 = "0.5.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
ed25519-dalek = "3.0.0"
futures = "0.3.31"
hex = "0.4.3"
hkdf = "0.13.0"
rand = "0.10.2"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
url = "2.5.7"
x25519-dalek = "3.0.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[lints]
workspace = true
