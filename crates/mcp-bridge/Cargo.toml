[package]
name = "mcp-bridge"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
build = "build.rs"
license = "FSL-1.1-MIT"
description = "Resilient stdio bridge for Ekubo Wallet MCP"

[[bin]]
name = "ekubo-wallet-mcp-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.23.0"
