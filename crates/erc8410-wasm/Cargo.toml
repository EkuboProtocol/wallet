[package]
name = "erc8410-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "JavaScript bindings for ERC-8410 execution plans"
repository = "https://github.com/EkuboProtocol/wallet"
license = "FSL-1.1-MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
erc8410 = { path = "../erc8410" }
serde_json = "1.0.145"
wasm-bindgen = "0.2"

[lints]
workspace = true

# Rust's release profile already optimizes this module. Avoid wasm-pack's
# bundled wasm-opt rejecting bulk-memory instructions emitted by current Rust.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
