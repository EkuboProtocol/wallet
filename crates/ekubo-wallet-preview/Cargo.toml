[package]
name = "ekubo-wallet-preview"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
description = "The embedded transaction-preview model: a tiny GPU transformer over clear-signed calls"
repository = "https://github.com/EkuboProtocol/wallet"
license = "FSL-1.1-MIT"
publish = false

[features]
default = ["gpu"]

# The desktop wallet's backend: native `wgpu`, which is Metal, Direct3D or
# Vulkan depending on the platform, and the same interface GPUI already draws
# through.
gpu = ["burn/wgpu", "dep:wgpu"]

# A browser wallet's backend: WebGPU through wasm-bindgen. Optional because
# WebGPU is not everywhere yet -- a build with neither this nor `gpu` runs the
# forward pass on the CPU through `ndarray` and compiles to a smaller `.wasm`.
webgpu = ["burn/webgpu", "dep:wgpu"]

# The training pipeline: corpus synthesis from the vendored ERC-7730 registry,
# the autodiff backend, and the optimizer loop.
#
# Never enabled by a release build of the wallet, which only ever runs the
# forward pass over the weights committed under `model/`. It is what pulls in
# `ekubo-wallet-core` -- the dependency runs one way, and only here, so the
# shipped preview crate stays a leaf that no kernel code can reach into.
train = [
    "burn/autodiff",
    "dep:alloy",
    "dep:ekubo-wallet-core",
    "dep:rand",
    "dep:serde_json",
]

[dependencies]
# `default-features = false` keeps the dataset and training stack out. Only
# `ndarray` is unconditional: it is the CPU fallback, the backend the tests run
# on, and the one that works everywhere including `wasm32` with no adapter. A
# GPU backend is a feature on top.
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "std"] }

alloy = { version = "=2.4.1", features = ["dyn-abi", "json-abi"], optional = true }
ekubo-wallet-core = { path = "../ekubo-wallet-core", optional = true }
futures = "0.3.31"
rand = { version = "0.10.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }

# On `wasm32-unknown-unknown` there is no ambient entropy source, so
# `getrandom` -- which reaches this crate through burn's own dependencies --
# refuses to build until it is told to use the browser's `crypto` object. It is
# named here rather than left to a downstream wallet because a browser build of
# *this* crate is a thing we support, and a compile error that only appears
# three crates away is not.
#
# Nothing in the forward pass draws random numbers. This is a build-time
# requirement of a transitive dependency, not a source of entropy the model
# uses.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu"], optional = true }

[dev-dependencies]
serde_json = "1.0.145"

[[bin]]
name = "preview-sample"
path = "src/bin/preview_sample.rs"
required-features = ["train"]
test = false

[[bin]]
name = "preview-train"
path = "src/bin/preview_train.rs"
required-features = ["train"]
test = false

[[bin]]
name = "preview-corpus"
path = "src/bin/preview_corpus.rs"
required-features = ["train"]
test = false

[lints]
workspace = true

[[bin]]
name = "preview-bench"
path = "src/bin/preview_bench.rs"
required-features = ["train"]
test = false

[[bin]]
name = "preview-card-eval"
path = "src/bin/preview_card_eval.rs"
required-features = ["train"]
test = false
