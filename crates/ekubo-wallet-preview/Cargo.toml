[package]
name = "ekubo-wallet-preview"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
description = "The embedded transaction-preview model: a tiny GPU transformer over clear-signed calls"
repository = "https://github.com/EkuboProtocol/wallet"
license = "FSL-1.1-MIT"
publish = false

[features]
# The training pipeline: corpus synthesis, the autodiff backend, and the
# optimizer. Never enabled by a release build of the wallet, which only ever
# runs the forward pass over the weights committed under `model/`.
train = ["dep:burn-autodiff", "dep:serde_json", "dep:rand"]

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "wgpu"] }
burn-autodiff = { version = "0.21.0", optional = true }
rand = { version = "0.10.0", optional = true }
serde_json = { version = "1.0.145", optional = true }

[dev-dependencies]
serde_json = "1.0.145"

[lints]
workspace = true
