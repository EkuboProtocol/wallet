[package]
name = "ekubo-wallet-client"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "FSL-1.1-MIT"
description = "Authenticated IPC client and shared wallet service protocol"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
ekubo-wallet-core = { path = "../ekubo-wallet-core" }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["serde"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[lints]
workspace = true
