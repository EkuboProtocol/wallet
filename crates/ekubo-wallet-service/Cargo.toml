[package]
name = "ekubo-wallet-service"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "FSL-1.1-MIT"
description = "Headless wallet authority for the isolated custody service"

[dependencies]
ekubo-wallet-core = { path = "../ekubo-wallet-core" }
ekubo-wallet-preview = { path = "../ekubo-wallet-preview", default-features = false }
alloy = { version = "=2.4.1", features = ["consensus", "dyn-abi", "eips", "json-abi", "k256", "rlp", "signer-keystore"] }
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
url = { version = "2.5.7", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
async-trait = "0.1.89"
base64 = "0.23.0"
ekubo-wallet-core = { path = "../ekubo-wallet-core", features = ["test-hooks"] }

[lints]
workspace = true
