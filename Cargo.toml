[package]
name = "ekubo-wallet"
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
description = "Local-first EVM wallet, CLI, and MCP server with policy-enforced signing"
repository = "https://github.com/EkuboProtocol/secure-wallet-mcp-server"
keywords = ["mcp", "ethereum", "wallet", "eip-7702"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "ekubo-wallet"
path = "src/main.rs"

[dependencies]
alloy = { version = "=2.1.0", features = ["consensus", "dyn-abi", "eips", "json-abi", "k256", "rlp", "signer-keystore"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
directories = "6.0.0"
fs2 = "0.4.3"
futures = "0.3.31"
hex = "0.4.3"
keyring = "4.1.6"
num-bigint = "0.4.6"
rand = "0.9.2"
revm = { version = "42.0.1", features = ["alloydb", "serde-json"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
rpassword = "7.4.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "chrono", "serde_json", "uuid"] }
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha3 = "0.10.8"
thiserror = "2.0.17"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.1", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["LAContext", "LAPublicDefines", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }
zbus_polkit = "5.0.0"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
