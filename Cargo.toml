[package]
name = "ekubo-wallet"
version = "1.0.0-rc.0"
edition = "2024"
rust-version = "1.91"
build = "build.rs"
description = "Local-first EVM desktop wallet with policy-enforced agent signing"
repository = "https://github.com/EkuboProtocol/wallet-mcp-server"
license = "FSL-1.1-MIT"
keywords = ["mcp", "ethereum", "wallet", "eip-7702"]
categories = ["cryptography::cryptocurrencies", "gui"]

[workspace]
members = ["crates/ekubo-wallet-core", "crates/walletconnect-session"]

[[bin]]
name = "ekubo-wallet"
path = "src/main.rs"

[dependencies]
ekubo-wallet-core = { path = "crates/ekubo-wallet-core" }
walletconnect-session = { path = "crates/walletconnect-session" }
alloy = { version = "=2.1.1", features = ["consensus", "dyn-abi", "eips", "json-abi", "k256", "rlp", "signer-keystore"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.6"
base64 = "0.23.0"
chrono = { version = "0.4.42", features = ["serde"] }
cargo-packager-updater = "=0.2.3"
directories = "6.0.0"
fs2 = "0.4.3"
futures = "0.3.31"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "26cc9366abb27ccedce386ac99a615a8fa7018da" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "26cc9366abb27ccedce386ac99a615a8fa7018da" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed" }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
minisign-verify = "0.2.5"
num-bigint = "0.5.1"
notify-rust = "4.18.0"
rand = "0.10.0"
# Same feature set as the core crate's, so the release check adds a call site
# rather than a build.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rqrr = "0.10.1"
rmcp = { version = "3.1.0", features = ["transport-streamable-http-server"] }
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
subtle = "2.6.1"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.17"
toml_edit = "0.22.27"
tower = "0.5.2"
tray-icon = "0.24.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zeroize = { version = "1.8.2", features = ["derive"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Allow development checks with Command Line Tools alone. Signed release CI
# may precompile the same pinned Metal shaders using full Xcode.
gpui_macos = { git = "https://github.com/zed-industries/zed", features = ["runtime_shaders"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.3"

[dev-dependencies]
ekubo-wallet-core = { path = "crates/ekubo-wallet-core", features = ["test-hooks"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[package.metadata.packager]
product-name = "Ekubo Wallet"
identifier = "org.ekubo.wallet"
formats = ["app", "dmg", "nsis", "appimage", "deb", "rpm"]
before-packaging-command = "cargo build --release"
resources = ["schemas", "contrib/polkit/com.ekubo.wallet.policy"]
icons = ["target/packager-assets/icon-512.png"]

[package.metadata.gpui-revisions]
zed = "cc053a4a6fa2fd0e8793201ed9099466af1be0b1"
gpui-component = "26cc9366abb27ccedce386ac99a615a8fa7018da"

# Unoptimized MSVC frames for the deeply generic alloy, rmcp, and schemars call
# chains are large enough to overflow Windows test-thread stacks even at a
# 16 MiB RUST_MIN_STACK. Light optimization shrinks those frames by an order of
# magnitude while keeping debug assertions and overflow checks on. `test`
# inherits `dev`, so one knob covers unit tests, integration tests, and the
# binaries they spawn.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Cargo turns overflow checks off in `release` and leaves them on in `dev`, so
# without this line every test in this repository runs against arithmetic that
# traps and the one build anybody installs runs against arithmetic that wraps.
# A wallet that wraps does not fail — it produces a number, and a wrong amount,
# fee cap, deadline, or index is indistinguishable downstream from a right one.
# Ship what the tests were written against. This is the workspace root manifest,
# so it covers the kernel crate and every dependency in the same build.
overflow-checks = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# The custody bans in `clippy.toml` refuse the build rather than warning in it.
# Everything else here is advice about how the code reads; these two say that
# presentation code has reached for a private key or a signer, and a warning is
# the wrong response to that — the gate prints warnings by the screenful and
# nothing fails, so a warning is a thing you scroll past. See `clippy.toml` for
# what is banned and why, and `crates/ekubo-wallet-core/clippy.toml` for the
# kernel's exemption.
disallowed_methods = "deny"
disallowed_types = "deny"
