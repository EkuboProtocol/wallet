[package]
name = "ekubo-wallet"
version = "1.0.0-rc.0"
edition = "2024"
rust-version = "1.91"
description = "Local-first EVM wallet, CLI, and MCP server with policy-enforced signing"
repository = "https://github.com/EkuboProtocol/wallet-mcp-server"
keywords = ["mcp", "ethereum", "wallet", "eip-7702"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[workspace]
members = ["crates/ekubo-wallet-core"]

[[bin]]
name = "ekubo-wallet"
path = "src/main.rs"

[dependencies]
ekubo-wallet-core = { path = "crates/ekubo-wallet-core" }
alloy = { version = "=2.1.1", features = ["consensus", "dyn-abi", "eips", "json-abi", "k256", "rlp", "signer-keystore"] }
alloy-dyn-abi = { version = "=1.6.1", features = ["eip712"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
clap_complete = "4.5.61"
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
hex = "0.4.3"
num-bigint = "0.5.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
unicode-width = "0.2.2"
zeroize = { version = "1.8.2", features = ["derive"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
x25519-dalek = "3.0.0"
ed25519-dalek = "3.0.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
bs58 = "0.5.1"
rand = "0.10.2"
base64 = "0.22.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }

[dev-dependencies]
assert_cmd = "2.1.1"
base64 = "0.22.1"
ekubo-wallet-core = { path = "crates/ekubo-wallet-core", features = ["test-hooks"] }

# Unoptimized MSVC frames for the deeply generic alloy, rmcp, and schemars call
# chains are large enough to overflow Windows test-thread stacks even at a
# 16 MiB RUST_MIN_STACK. Light optimization shrinks those frames by an order of
# magnitude while keeping debug assertions and overflow checks on. `test`
# inherits `dev`, so one knob covers unit tests, integration tests, and the
# binaries they spawn.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# The custody bans in `clippy.toml` refuse the build rather than warning in it.
# Everything else here is advice about how the code reads; these two say that
# presentation code has reached for a private key or a signer, and a warning is
# the wrong response to that — the gate prints warnings by the screenful and
# nothing fails, so a warning is a thing you scroll past. See `clippy.toml` for
# what is banned and why, and `crates/ekubo-wallet-core/clippy.toml` for the
# kernel's exemption.
disallowed_methods = "deny"
disallowed_types = "deny"
