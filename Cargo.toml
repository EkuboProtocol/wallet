[package]
name = "ekubo-wallet"
version.workspace = true
edition = "2024"
rust-version = "1.94.1"
build = "build.rs"
description = "Local-first EVM desktop wallet with policy-enforced agent signing"
repository = "https://github.com/EkuboProtocol/wallet"
license = "FSL-1.1-MIT"
keywords = ["mcp", "ethereum", "wallet", "eip-7702"]
categories = ["cryptography::cryptocurrencies", "gui"]

[workspace]
members = [
    "crates/erc8410",
    "crates/erc8410-wasm",
    "crates/ekubo-wallet-core",
    "crates/ekubo-wallet-preview",
    "crates/ekubo-wallet-preview-wasm",
    "crates/mcp-bridge",
    "crates/walletconnect-session",
    "crates/gpui-tokio",
]

[workspace.package]
version = "1.8.4"

[[bin]]
name = "ekubo-wallet"
path = "src/main.rs"
test = false

[dependencies]
ekubo-wallet-core = { path = "crates/ekubo-wallet-core" }
ekubo-wallet-preview = { path = "crates/ekubo-wallet-preview", default-features = false }
walletconnect-session = { path = "crates/walletconnect-session" }
alloy = { version = "=2.5.0", features = ["consensus", "dyn-abi", "eips", "json-abi", "k256", "rlp", "signer-keystore"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.23.0"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
fs2 = "0.4.3"
futures = "0.3.31"
# GPUI comes from the `gpui-pre-*` crates.io snapshots of Zed that
# gpui-component is built against. Every snapshot may change GPUI's API, so
# gpui-pre, gpui-component, and gpui-kit-assets move together and stay exact.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-component = { version = "=0.7.0", features = ["tree-sitter"] }
gpui-kit-assets = "=0.7.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11"] }
gpui_tokio = { path = "crates/gpui-tokio" }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-bigint = "0.5.1"
notify-rust = "4.18.0"
rand = "0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rmcp = { version = "3.4.1", features = ["transport-io"] }
schemars = { version = "1.1.0", features = ["chrono04", "uuid1"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
subtle = "2.6.1"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.17"
toml_edit = "0.25.13"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zeroize = { version = "1.8.2", features = ["derive"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Allow development checks with Command Line Tools alone. Signed release CI
# may precompile the same pinned Metal shaders using full Xcode.
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.7", features = ["runtime_shaders"] }
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3.1", default-features = false, features = ["NSString"] }
tray-icon = "0.25.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.3"
tray-icon = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
ekubo-wallet-core = { path = "crates/ekubo-wallet-core", features = ["test-hooks"] }
walkdir = "2.5.0"
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
# The fake platform behind `TestAppContext`, so the desktop's routes and
# overlays can be laid out and painted in a test with no display attached.
# Dev-dependencies do not apply to `cargo build --release`.
gpui = { package = "gpui-pre", version = "=0.3.7", features = ["test-support"] }
# The offscreen Metal renderer behind `capture_screenshot`, so the interface
# can be rasterised and looked at on a machine with no display attached.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["test-support"] }

[package.metadata.packager]
product-name = "Ekubo Wallet"
identifier = "org.ekubo.wallet"
formats = ["app", "dmg", "nsis", "appimage", "deb"]
before-packaging-command = "cargo build --release --workspace"
external-binaries = ["target/release/ekubo-wallet-mcp-bridge"]
resources = ["schemas"]
icons = ["assets/app-icon-512.png"]

# polkit reads action definitions only from this root-owned directory, so a
# package that can write there puts the definition in place itself. The
# AppImage cannot; it carries the same document compiled into the binary
# (`ekubo_wallet_core::polkit::POLICY_DOCUMENT`) and streams it to pkexec's
# install(1) from Settings → Owner authentication, so it ships no copy here.
[package.metadata.packager.deb]
files = { "contrib/polkit/com.ekubo.wallet.policy" = "/usr/share/polkit-1/actions/com.ekubo.wallet.policy" }

[package.metadata.gpui-revisions]
# The Zed commit the pinned gpui-pre snapshot was cut from, as named in the
# gpui-pre crate description, and the gpui-component commit of its release.
zed = "1a28cff4b409169bac058bca40dfbfeb7621d19b"
gpui-component = "0c830f4d257e69fdd17200650533ab4ca9a40cc0"

# Unoptimized MSVC frames for the deeply generic alloy, rmcp, and schemars call
# chains are large enough to overflow Windows test-thread stacks even at a
# 16 MiB RUST_MIN_STACK. Light optimization shrinks those frames by an order of
# magnitude while keeping debug assertions and overflow checks on. `test`
# inherits `dev`, so one knob covers unit tests, integration tests, and the
# binaries they spawn.
[profile.dev]
opt-level = 1

# Browser builds only. Separate from `release` because the desktop wallet needs
# unwinding -- it catches a panic from inside the graphics driver so a failed
# preview cannot take the window down -- while a `.wasm` has no such guard to
# preserve and pays for unwinding tables in bytes a wallet has to download.
#
# Size is the whole point here. A browser wallet that ships this is asking a
# person to fetch it before they can review a transaction.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Cargo turns overflow checks off in `release` and leaves them on in `dev`, so
# without this line every test in this repository runs against arithmetic that
# traps and the one build anybody installs runs against arithmetic that wraps.
# A wallet that wraps does not fail — it produces a number, and a wrong amount,
# fee cap, deadline, or index is indistinguishable downstream from a right one.
# Ship what the tests were written against. This is the workspace root manifest,
# so it covers the kernel crate and every dependency in the same build.
overflow-checks = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
# Not in `all` or `pedantic`: it lives in clippy's `restriction` group, and
# clippy's own docs say it does not measure cognitive complexity especially
# well. It is on as a coarse guardrail against a function quietly becoming
# unreviewable, not as a precise metric. The threshold is in `clippy.toml` --
# and note that `crates/ekubo-wallet-core/clippy.toml` replaces that file
# rather than merging with it, so the threshold is written in both.
cognitive_complexity = "warn"
# The custody bans in `clippy.toml` refuse the build rather than warning in it.
# Everything else here is advice about how the code reads; these two say that
# presentation code has reached for a private key or a signer, and a warning is
# the wrong response to that — the gate prints warnings by the screenful and
# nothing fails, so a warning is a thing you scroll past. See `clippy.toml` for
# what is banned and why, and `crates/ekubo-wallet-core/clippy.toml` for the
# kernel's exemption.
disallowed_methods = "deny"
disallowed_types = "deny"

# The published crate renders a `raw` signed integer through `BigUint`, so a
# tick of -140 reads as 2^256 - 140 on an approval screen. ERC-7730 defines
# `raw` as the natural representation of the underlying type and has no
# signed-integer format at all, so descriptors cannot route around it.
#
# The branch is the published 0.1.0 tree with that one arm split, and nothing
# else: it is cut from the commit whose source is byte-identical to the
# release rather than from the fork's `main`, which carries a thousand lines
# of unreleased renderer work this build has no reason to take.
#
# Remove this once the fix is upstream and released.
[patch.crates-io]
clear-signing = { git = "https://github.com/EkuboProtocol/clear-signing", branch = "fix-raw-signed-integers-0.1.0" }

# Training/evaluation binaries need optimized arithmetic, but whole-program
# LTO makes iterating on the model unnecessarily slow. Desktop release settings
# remain independent.
[profile.preview-train]
inherits = "release"
lto = false
codegen-units = 16
