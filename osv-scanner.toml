# These are RustSec informational maintenance notices, not reported security
# defects. Keep every exception explicit and expiring so OSV-Scanner remains
# fail-closed for new advisories and forces a periodic dependency migration
# review.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0388"
ignoreUntil = 2027-02-15
reason = "Informational unmaintained notice for transitive derivative; replace through its upstream dependency before this exception expires."

