# deps.dev had not yet indexed these exact crates.io snapshots when they were
# pinned, although earlier versions of the same crates resolve to Apache-2.0
# there and their published manifests declare Apache-2.0. Keep that evidence
# explicit and short-lived instead of allowing every package with UNKNOWN
# metadata; drop it once deps.dev reports the pinned versions.
[[PackageOverrides]]
name = "gpui-base|gpui-component(-macros)?|gpui-kit-assets|gpui-pre(-[a-z-]+)?"
nameIsRegex = true
license.override = ["Apache-2.0"]
effectiveUntil = 2026-11-30
reason = "The exact pinned crates.io manifest declares Apache-2.0; deps.dev has no matching package-version record yet."

# OSV-Scanner's allowlist accepts SPDX license identifiers but not standalone
# exception identifiers. LLVM-exception only relaxes Apache-2.0's conditions,
# so normalize this one exact package to its underlying allowed license.
[[PackageOverrides]]
name = "ar_archive_writer"
version = "0.5.3"
license.override = ["Apache-2.0"]
effectiveUntil = 2027-02-15
reason = "Declared Apache-2.0 WITH LLVM-exception; OSV's allowlist parser does not accept exception identifiers."

# ekubo_sdk is first-party EkuboProtocol code, published by the same copyright
# holder as this wallet, so its LGPL-2.1 terms create no obligation the project
# does not already control. Do not widen the allowlist to LGPL-2.1 for every
# dependency to accommodate one first-party crate; keep the exception narrow
# and expiring, and relicense the SDK permissively upstream before it lapses.
[[PackageOverrides]]
name = "ekubo_sdk"
version = "3.2.0"
license.ignore = true
effectiveUntil = 2027-02-15
reason = "First-party EkuboProtocol crate under the same copyright holder; relicense the upstream SDK permissively before this exception expires."
