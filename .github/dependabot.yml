version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # The preview hands wgpu types to Burn/CubeCL; major upgrades must move
    # together. The browser compile check in CI verifies this boundary.
    ignore:
      - dependency-name: wgpu
        update-types: ["version-update:semver-major"]
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
