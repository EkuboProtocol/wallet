name: Tests

on:
  pull_request:
    # These paths are not consumed or validated by any job below. Embedded
    # MCP/legal Markdown is intentionally absent: changing it rebuilds and
    # tests the application.
    paths-ignore:
      - ".agents/**"
      - ".gitattributes"
      - ".github/apple/**"
      - ".github/dependabot.yml"
      - ".github/workflows/release.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "audits/**"
      - "contrib/polkit/**"
      - "contrib/rehearse-macos-signing.sh"
      - "contrib/rpc-probe/**"
      - "contrib/sync-claude-desktop-version.py"
      - "contrib/vendor-default-tokens.py"
      - "crates/ekubo-wallet-core/clearsign/README.md"
      - "docs/approval-ux.md"
      - "docs/architecture.md"
      - "docs/releasing.md"
      - "docs/security-boundary.md"
      - "docs/storage.md"
      - "examples/abi-decoding.json"
      - "examples/policy.json"
      - "integrations/claude-desktop/README.md"
      - "schemas/**"
      - "scripts/**"
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - ".gitattributes"
      - ".github/apple/**"
      - ".github/dependabot.yml"
      - ".github/workflows/release.yml"
      - ".gitignore"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "audits/**"
      - "contrib/polkit/**"
      - "contrib/rehearse-macos-signing.sh"
      - "contrib/rpc-probe/**"
      - "contrib/sync-claude-desktop-version.py"
      - "contrib/vendor-default-tokens.py"
      - "crates/ekubo-wallet-core/clearsign/README.md"
      - "docs/approval-ux.md"
      - "docs/architecture.md"
      - "docs/releasing.md"
      - "docs/security-boundary.md"
      - "docs/storage.md"
      - "examples/abi-decoding.json"
      - "examples/policy.json"
      - "integrations/claude-desktop/README.md"
      - "schemas/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info for the GPUI, alloy, and schemars graph takes longer to emit and
  # link than the code takes to compile, and it is the bulk of what the build
  # cache stores, restores, and uploads. This governs the dependencies; the test
  # job sets `CARGO_PROFILE_TEST_DEBUG` per runner, so the test binaries keep
  # whatever the linker there can survive. Line tables still point panic
  # backtraces at real source lines, and frame sizes come from `opt-level`, so
  # the Windows stack story is unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  claude-desktop:
    name: Claude Desktop plugin
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/claude-desktop
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/claude-desktop/package-lock.json

      - name: Install pinned build dependencies
        run: npm ci

      - name: Test credential-free bridge
        run: npm test

      - name: Validate and pack Claude plugin
        run: npm run validate:plugin && npm run pack:plugin

  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPUI makes each desktop test binary large. Linking several of them
          # concurrently can exhaust the Linux hosted runner and crash
          # rust-lld with SIGBUS, so keep link concurrency deliberately low.
          - runner: ubuntu-24.04
            test_jobs: 1
            test_debug: 0
          - runner: macos-15
            test_jobs: 4
            test_debug: 2
          - runner: windows-2025
            test_jobs: 1
            test_debug: 0
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # The Windows job spends most of its time compiling vendored SQLCipher
      # and OpenSSL; caching cuts that to minutes on unchanged dependencies.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cargo invocation cancelled part way through still saves what it
          # built, and the entry cannot be replaced afterwards because the key
          # already exists. That froze a cache holding only `cargo check`
          # metadata, so every later run recompiled all 549 crates before it
          # could link a test binary. Bump this prefix to discard a cache that
          # is wrong rather than merely cold.
          prefix-key: v1-rust
          # Tests that fail still leave a fully compiled dependency graph
          # behind, and that is the expensive half of this job.
          cache-on-failure: true

      # Link and run every integration test once on Linux. macOS and Windows
      # still compile those platform-specific targets below, but do not spend
      # most of their job relinking the same large GPUI test executables.
      - name: Run complete test suite
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: 67108864
          # Linux's hosted linker has repeatedly crashed with SIGBUS while
          # mapping GPUI's full debug symbols. This changes diagnostics only,
          # not test behavior or optimization.
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked --workspace --all-features --jobs ${{ matrix.test_jobs }}

      - name: Compile application and integration tests
        if: runner.os != 'Linux'
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo check --locked --workspace --all-features --bins --tests

      - name: Run workspace unit tests
        if: runner.os != 'Linux'
        env:
          RUST_MIN_STACK: 67108864
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked --workspace --all-features --lib --jobs ${{ matrix.test_jobs }}

  lint:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # Clippy compiles the entire dependency graph before it lints a line of
      # this workspace, which was nine of this job's fifteen minutes on every
      # run. The cache key carries the job name, so these lint artifacts stay
      # separate from the test job's rather than displacing them.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          # A denied lint fails this job after the graph is already built.
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Verify dependency licenses and notices
        run: contrib/generate-third-party-licenses.py --check

      # Building the client from source cost five minutes to run a six-second
      # scan. This fetches the upstream release binary for the same pinned
      # version instead.
      - name: Install RustSec audit client
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependency advisories
        run: cargo audit
