name: Tests
run-name: ${{ github.event_name == 'pull_request' && 'Scoped PR checks (no Rust compilation)' || inputs.linux_acceptance_only && 'Installed Linux acceptance (no desktop rebuild)' || inputs.windows_installed_only && 'Installed Windows acceptance (headless)' || inputs.windows_auth_only && 'Windows collector acceptance (helper only)' || inputs.windows_primitives_only && 'Windows native diagnostics (not full CI)' || 'Full wallet milestone CI' }}

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/clippy.toml'
      - rust-toolchain.toml
      - ruff.toml
      - '.github/workflows/**'
      - 'contrib/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      windows_primitives_only:
        description: Real core/client/service diagnostics only; full matrix is the default milestone
        type: boolean
        default: false
      linux_acceptance_only:
        description: Run installed Linux acceptance without rebuilding the desktop test suite
        type: boolean
        default: false
      windows_auth_only:
        description: Test the protected Windows collector without rebuilding the wallet
        type: boolean
        default: false
      windows_installed_only:
        description: Enroll and restart the real Windows service with a distinct standard owner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Cheap PR checks must not cancel a manually dispatched native milestone.
  # Repeated runs of the same class still supersede one another on this branch.
  group: wallet-ci-${{ github.event_name == 'pull_request' && 'source' || inputs.linux_acceptance_only && 'installed-linux' || inputs.windows_installed_only && 'windows-installed' || inputs.windows_auth_only && 'windows-auth' || inputs.windows_primitives_only && 'windows-diagnostics' || 'native' }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_MIN_STACK: 67108864

jobs:
  scoped:
    name: Source and packaging checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: pipx run ruff==0.16.4 check --output-format concise .
      - run: python3 contrib/check-v2-packaging.py
      - run: python3 contrib/accept-installed-linux.py --check-guards
      - run: for file in contrib/deb-v2-* contrib/smoke-v2-*.sh; do bash -n "$file"; done

  windows-service:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_primitives_only
    name: Real Windows native diagnostics
    runs-on: windows-2025
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
      - run: python contrib/check-windows-service.py
      - name: Protected collector boundary and availability (no consent)
        shell: pwsh
        run: contrib/test-windows-auth-boundary.ps1

  windows-auth:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_auth_only
    runs-on: windows-2025
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-collector-acceptance
          cache-on-failure: true
      - run: cargo build --locked -p ekubo-wallet-windows-owner-auth --bin ekubo-wallet-v2-owner-auth
      - name: Ordinary read-only availability control
        run: cargo test --locked -p ekubo-wallet-windows-owner-auth --lib ordinary_process_completes_read_only_availability_query -- --nocapture
      - name: Protected process boundary and availability
        shell: pwsh
        run: contrib/test-windows-auth-boundary.ps1

  windows-installed:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_installed_only
    runs-on: windows-2025
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-installed-windows
          cache-on-failure: true
      - name: Enroll as standard owner with a distinct administrator
        shell: pwsh
        run: contrib/test-windows-installed-acceptance.ps1

  execution-plan:
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_primitives_only && !inputs.linux_acceptance_only && !inputs.windows_auth_only && !inputs.windows_installed_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown thumbv7em-none-eabi
      - run: |
          cargo test --locked -p erc8410 --no-default-features
          cargo test --locked -p erc8410 --features schema,serde_json/preserve_order
          cargo check --locked -p erc8410 --no-default-features --target thumbv7em-none-eabi
          cargo build --locked -p erc8410-wasm --target wasm32-unknown-unknown --release
          cargo check --locked -p ekubo-wallet-preview-wasm --target wasm32-unknown-unknown
      - run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/erc8410_wasm.wasm --target nodejs --out-dir crates/erc8410-wasm/pkg-node
          node crates/erc8410-wasm/smoke-test.cjs

  test:
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_primitives_only && !inputs.linux_acceptance_only && !inputs.windows_auth_only && !inputs.windows_installed_only
    name: Native milestone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev dbus dbus-tests gnome-keyring libsecret-tools policykit-1 libglib2.0-bin python3-dbus python3-gi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          cache-on-failure: false
      - name: Check production workspace without test hooks
        run: cargo check --locked --workspace --bins --lib --jobs 1
      - name: Workspace tests
        run: cargo test --locked --workspace --all-features --jobs 1
      - name: Native Windows protected collector boundary (no biometric interaction)
        if: runner.os == 'Windows'
        shell: pwsh
        run: contrib/test-windows-auth-boundary.ps1
      - name: Native Linux owner transport and keyring recovery
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p ekubo-wallet-core --all-features --lib credential_store::tests::recovers_after_secret_service_startup_and_restart -- --ignored
          cargo test --locked --workspace --all-features --lib owner_client::tests -- --ignored
          cargo test --locked --workspace --all-features --lib linux_relay_handoff::tests::installer_policy -- --ignored
      - name: Installed Linux fresh enrollment, restart and owner denial (disposable runner)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # Build production artifacts explicitly after the all-features tests;
          # dev-dependency test-hooks must not enter the installed service.
          cargo build --locked -p ekubo-wallet-service --bins --no-default-features --jobs 1
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" \
            python3 contrib/accept-installed-linux.py --run-disposable "$PWD/target/debug"
      - name: Installed Linux first-run move and interrupted retirement resume
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # Hooks construct ONLY the synthetic released-schema source. The move
          # client refuses to run with hooks, and the service stays production.
          cargo build --locked -p ekubo-wallet-core --example linux-move-fixture --features test-hooks --jobs 1
          cargo build --locked -p ekubo-wallet-core --example linux-move-client --no-default-features --jobs 1
          cargo build --locked -p ekubo-wallet-service --bins --no-default-features --jobs 1
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" \
            python3 contrib/accept-installed-linux.py --run-migration-disposable "$PWD/target/debug"

  linux-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_acceptance_only
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y dbus dbus-tests gnome-keyring libsecret-tools policykit-1 libglib2.0-bin python3-dbus python3-gi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-installed-acceptance
          # Preserve compiled dependencies when an installed acceptance assertion
          # fails; Cargo still recompiles changed workspace code on the next run.
          cache-on-failure: true
      - run: |
          cargo build --locked -p ekubo-wallet-core --example linux-move-fixture --features test-hooks --jobs 2
          cargo build --locked -p ekubo-wallet-core --example linux-move-client --no-default-features --jobs 2
          cargo build --locked -p ekubo-wallet-service --bins --no-default-features --jobs 2
      - name: Installed fresh enrollment and restart
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" python3 contrib/accept-installed-linux.py --run-disposable "$PWD/target/debug"
      - name: Installed move and keyless recovery
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" python3 contrib/accept-installed-linux.py --run-migration-disposable "$PWD/target/debug"

  lint:
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_primitives_only && !inputs.linux_acceptance_only && !inputs.windows_auth_only && !inputs.windows_installed_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: python3 contrib/generate-third-party-licenses.py --check
      - run: python3 scripts/generate-osv-lockfiles.py .osv-lockfiles
      - name: Vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.aarch64-apple-darwin.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-pc-windows-msvc.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-unknown-linux-gnu.lock
      - name: License scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --licenses=0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,BSL-1.0,CC0-1.0,CDLA-Permissive-2.0,ISC,MIT,MIT-0,MPL-2.0,NCSA,Unicode-3.0,Unlicense,Zlib,bzip2-1.0.6
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.aarch64-apple-darwin.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-pc-windows-msvc.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-unknown-linux-gnu.lock
