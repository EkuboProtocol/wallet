name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPUI makes each desktop test binary large. Linking several of them
          # concurrently can exhaust the Linux hosted runner and crash
          # rust-lld with SIGBUS, so keep link concurrency deliberately low.
          - runner: ubuntu-24.04
            test_jobs: 2
          - runner: macos-15
            test_jobs: 4
          - runner: windows-2025
            test_jobs: 2
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # The Windows job spends most of its time compiling vendored SQLCipher
      # and OpenSSL; caching cuts that to minutes on unchanged dependencies.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Diagnosis runs fail by design until the Windows overflow is fixed;
          # the expensive vendored SQLCipher/OpenSSL build must still be saved.
          cache-on-failure: true

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

      - name: Run tests
        # Also set in .cargo/config.toml for local runs. Repeated here because
        # the harness runs each test on a spawned thread, and Windows MSVC debug
        # frames overflow that thread's smaller default stack.
        env:
          RUST_MIN_STACK: 67108864
        run: cargo test --locked --workspace --all-features --jobs ${{ matrix.test_jobs }}

  lint:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Verify dependency licenses and notices
        run: contrib/generate-third-party-licenses.py --check

      - name: Install RustSec audit client
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependency advisories
        run: cargo audit
