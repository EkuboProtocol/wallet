name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      # The Windows job spends most of its time compiling vendored SQLCipher
      # and OpenSSL; caching cuts that to minutes on unchanged dependencies.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          # Diagnosis runs fail by design until the Windows overflow is fixed;
          # the expensive vendored SQLCipher/OpenSSL build must still be saved.
          cache-on-failure: true

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

      - name: Run tests
        # Also set in .cargo/config.toml for local runs. Repeated here because
        # the harness runs each test on a spawned thread, and Windows MSVC debug
        # frames overflow that thread's smaller default stack.
        env:
          RUST_MIN_STACK: 67108864
        run: cargo test --locked --all-features

  lint:
    name: Formatting and lints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # install.sh is piped to a shell by users, so it is linted like source.
      - name: Lint the installer
        run: shellcheck --shell=sh install.sh

      - name: Install RustSec audit client
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependency advisories
        run: cargo audit
