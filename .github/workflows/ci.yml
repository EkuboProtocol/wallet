  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - ".agents/**"
  #     - ".gitattributes"
  #     - ".github/apple/**"
  #     - ".github/dependabot.yml"
  #     - ".github/workflows/release.yml"
  #     - ".github/workflows/build-release-artifacts.yml"
  #     - ".gitignore"
  #     - "AGENTS.md"
  #     - "README.md"
  #     - "contrib/polkit/**"
  #     - "contrib/rehearse-macos-signing.sh"
  #     - "contrib/rpc-probe/**"
  #     - "contrib/vendor-default-tokens.py"
  #     - "crates/ekubo-wallet-core/clearsign/README.md"
  #     - "docs/approval-ux.md"
  #     - "docs/architecture.md"
  #     - "docs/releasing.md"
  #     - "docs/security-boundary.md"
  #     - "docs/storage.md"
  #     - "examples/abi-decoding.json"
  #     - "examples/policy.json"
  #     - "schemas/**"
  workflow_dispatch:
    inputs:
      windows_primitives_only:
        description: Run only native primitive diagnostics; does not satisfy full CI or release checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.windows_primitives_only && 'native' || 'full' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info for the GPUI, alloy, and schemars graph takes longer to emit and
  # link than the code takes to compile, and it is the bulk of what the build
  # cache stores, restores, and uploads. This governs the dependencies; the test
  # job sets `CARGO_PROFILE_TEST_DEBUG` per runner, so the test binaries keep
  # whatever the linker there can survive. Line tables still point panic
  # backtraces at real source lines, and frame sizes come from `opt-level`, so
  # the Windows stack story is unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  windows-service:
    name: Windows service primitives
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latest stable Rust
        run: rustup update stable --no-self-update
      - name: Execute native Windows service tests
        run: python contrib/check-windows-service.py --output-root "$env:RUNNER_TEMP" --scm-fixture

  execution-plan:
    if: ${{ !inputs.windows_primitives_only }}
    name: Execution plan (no_std and JavaScript)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust targets
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-unknown-unknown thumbv7em-none-eabi
      - name: Test execution plans with both JSON map implementations
        run: |
          cargo test --locked -p erc8410 --no-default-features
          cargo test --locked -p erc8410 --features schema,serde_json/preserve_order
      - name: Check without a standard library
        run: cargo check --locked -p erc8410 --no-default-features --target thumbv7em-none-eabi
      - name: Build Wasm
        run: cargo build --locked -p erc8410-wasm --target wasm32-unknown-unknown --release
      - name: Check browser transaction-preview backend
        run: cargo check --locked -p ekubo-wallet-preview-wasm --target wasm32-unknown-unknown
      - name: Generate and test JavaScript bindings
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/erc8410_wasm.wasm --target nodejs --out-dir crates/erc8410-wasm/pkg-node
          node crates/erc8410-wasm/smoke-test.cjs
  test:
    if: ${{ !inputs.windows_primitives_only }}
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPUI makes each desktop test binary large. Linking several of them
          # concurrently can exhaust the Linux hosted runner and crash
          # rust-lld with SIGBUS, so keep link concurrency deliberately low.
          - runner: ubuntu-24.04
            test_jobs: 1
            test_debug: 0
          - runner: macos-15
            test_jobs: 4
            test_debug: 2
          - runner: windows-2025
            test_jobs: 1
            test_debug: 0
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev dbus dbus-tests gnome-keyring

      - name: Refuse GTK tray dependencies on Linux
        if: runner.os == 'Linux'
        run: test -z "$(cargo tree --locked --target x86_64-unknown-linux-gnu -i glib 2>/dev/null)"

      # The Windows job spends most of its time compiling vendored SQLCipher
      # and OpenSSL; caching cuts that to minutes on unchanged dependencies.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # GitHub cache entries are immutable. The previous generation saved
          # canceled jobs and could permanently capture a partial target tree,
          # forcing every later run to rebuild its missing dependencies.
          prefix-key: v2-rust
          cache-on-failure: false

      # Link and run every integration test once on Linux. macOS and Windows
      # still compile those platform-specific targets below, but do not spend
      # most of their job relinking the same large GPUI test executables.
      - name: Run complete test suite
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: 67108864
          # Linux's hosted linker has repeatedly crashed with SIGBUS while
          # mapping GPUI's full debug symbols. This changes diagnostics only,
          # not test behavior or optimization.
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked --workspace --all-features --jobs ${{ matrix.test_jobs }}

      - name: Test Secret Service startup and restart recovery
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: 67108864
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked -p ekubo-wallet-core --all-features --lib credential_store::tests::recovers_after_secret_service_startup_and_restart -- --ignored

      - name: Test Windows service boundary
        if: runner.os == 'Windows'
        env:
          RUST_MIN_STACK: 67108864
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        # Execute native custody checks before linking the large desktop suite.
        # The complete workspace checks below remain required.
        run: cargo test --locked -p ekubo-wallet-core --all-features --lib --jobs ${{ matrix.test_jobs }} windows_service_

      - name: Test isolated owner transport and custody relay
        # Private buses exercise activation, authentication, ciphertext relay readiness,
        # name replacement, and disconnects without desktop credentials.
        # Keep these ignored tests explicitly enabled in the Linux gate.
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: 67108864
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked --workspace --all-features --lib owner_client::tests -- --ignored

      - name: Test encrypted migration through the Windows service
        if: runner.os == 'Windows'
        env:
          CARGO_PROFILE_DEV_DEBUG: ${{ matrix.test_debug }}
        run: |
          cargo build --locked -p ekubo-wallet-service --features migration-fixture --example windows-migration-scm --jobs ${{ matrix.test_jobs }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File contrib/check-windows-provisioning-scm.ps1 -FixtureBinary target/debug/examples/windows-migration-scm.exe -StopAfterClient

      - name: Compile application and integration tests
        if: runner.os != 'Linux'
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked --workspace --all-features --no-run --jobs ${{ matrix.test_jobs }}

      - name: Run workspace unit tests
        if: runner.os != 'Linux'
        env:
          RUST_MIN_STACK: 67108864
          CARGO_PROFILE_TEST_DEBUG: ${{ matrix.test_debug }}
        run: cargo test --locked --workspace --all-features --lib --jobs ${{ matrix.test_jobs }}

  lint:
    if: ${{ !inputs.windows_primitives_only }}
    name: Formatting and lints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev

      # Clippy compiles the entire dependency graph before it lints a line of
      # this workspace, which was nine of this job's fifteen minutes on every
      # run. The cache key carries the job name, so these lint artifacts stay
      # separate from the test job's rather than displacing them.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          cache-on-failure: false

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check Python complexity
        run: pipx run ruff==0.16.4 check --output-format concise .

      - name: Verify bundled third-party notices are current
        run: contrib/generate-third-party-licenses.py --check

      - name: Generate release-target dependency inputs
        run: python3 scripts/generate-osv-lockfiles.py .osv-lockfiles

      - name: Scan dependencies for vulnerabilities with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.aarch64-apple-darwin.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-pc-windows-msvc.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-unknown-linux-gnu.lock

      - name: Enforce dependency licenses with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --licenses=0BSD,Apache-2.0,BSD-1-Clause,BSD-2-Clause,BSD-3-Clause,BSL-1.0,CC0-1.0,CDLA-Permissive-2.0,ISC,MIT,MIT-0,MPL-2.0,NCSA,Unicode-3.0,Unlicense,Zlib,bzip2-1.0.6
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.aarch64-apple-darwin.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-pc-windows-msvc.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-unknown-linux-gnu.lock
