name: Tests
run-name: ${{ github.event_name == 'pull_request' && 'Scoped PR checks (no Rust compilation)' || (inputs.windows_primitives_only && 'Windows native diagnostics (not full CI)' || 'Full wallet milestone CI') }}

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/clippy.toml'
      - rust-toolchain.toml
      - ruff.toml
      - '.github/workflows/**'
      - 'contrib/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      windows_primitives_only:
        description: Real core/client/service diagnostics only; full matrix is the default milestone
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wallet-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_MIN_STACK: 67108864

jobs:
  scoped:
    name: Source and packaging checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: pipx run ruff==0.16.4 check --output-format concise .
      - run: python3 contrib/check-v2-packaging.py
      - run: for file in contrib/deb-v2-* contrib/smoke-v2-*.sh; do bash -n "$file"; done

  windows-service:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_primitives_only
    name: Real Windows native diagnostics
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
      - run: python contrib/check-windows-service.py

  execution-plan:
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_primitives_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown thumbv7em-none-eabi
      - run: |
          cargo test --locked -p erc8410 --no-default-features
          cargo test --locked -p erc8410 --features schema,serde_json/preserve_order
          cargo check --locked -p erc8410 --no-default-features --target thumbv7em-none-eabi
          cargo build --locked -p erc8410-wasm --target wasm32-unknown-unknown --release
          cargo check --locked -p ekubo-wallet-preview-wasm --target wasm32-unknown-unknown
      - run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/erc8410_wasm.wasm --target nodejs --out-dir crates/erc8410-wasm/pkg-node
          node crates/erc8410-wasm/smoke-test.cjs

  test:
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_primitives_only
    name: Native milestone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev dbus dbus-tests gnome-keyring
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          cache-on-failure: false
      - name: Check production workspace without test hooks
        run: cargo check --locked --workspace --bins --lib --jobs 1
      - name: Workspace tests
        run: cargo test --locked --workspace --all-features --jobs 1
      - name: Native Linux owner transport and keyring recovery
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p ekubo-wallet-core --all-features --lib credential_store::tests::recovers_after_secret_service_startup_and_restart -- --ignored
          cargo test --locked --workspace --all-features --lib owner_client::tests -- --ignored
          cargo test --locked --workspace --all-features --lib linux_relay_handoff::tests::installer_policy -- --ignored

  lint:
    if: github.event_name == 'workflow_dispatch' && !inputs.windows_primitives_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: python3 contrib/generate-third-party-licenses.py --check
      - run: python3 scripts/generate-osv-lockfiles.py .osv-lockfiles
      - name: Vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.aarch64-apple-darwin.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-pc-windows-msvc.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-unknown-linux-gnu.lock
      - name: License scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --licenses=0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,BSL-1.0,CC0-1.0,CDLA-Permissive-2.0,ISC,MIT,MIT-0,MPL-2.0,NCSA,Unicode-3.0,Unlicense,Zlib,bzip2-1.0.6
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.aarch64-apple-darwin.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-pc-windows-msvc.lock
            --lockfile=Cargo.lock:.osv-lockfiles/Cargo.x86_64-unknown-linux-gnu.lock
