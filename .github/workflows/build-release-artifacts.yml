name: Build unsigned release artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or exact commit SHA to build
        required: true
        type: string
      platform:
        description: Linux includes both Debian and Arch/Omarchy packages
        type: choice
        default: all
        options: [all, linux, windows, macos]

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: Validate requested source reference
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9A-Za-z][0-9A-Za-z._/+@-]{0,254}$ ]]
      - id: matrix
        name: Select requested package targets
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = {
              'macos': {'os': 'macos-15', 'platform': 'macos-aarch64', 'formats': 'app'},
              'windows': {'os': 'windows-2025', 'platform': 'windows-x86_64', 'formats': 'nsis'},
              'linux': {'os': 'ubuntu-24.04', 'platform': 'linux-x86_64', 'formats': 'deb'},
          }
          selected = os.environ['SELECTED_PLATFORM']
          rows = list(targets.values()) if selected == 'all' else [targets[selected]]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('platforms=' + json.dumps(rows) + '\n')
          PY

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out and resolve the requested reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: identity
        name: Compute source and build identity
        shell: bash
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ vars.EKUBO_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$EKUBO_UPDATER_PUBLIC_KEY"
          commit_sha="$(git rev-parse HEAD)"
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tags="$(git tag --points-at HEAD)"
          build_version="$package_version+$(git rev-parse --short=7 HEAD)"
          while IFS= read -r tag; do
            if [[ "$tag" == "v$package_version" ]]; then
              build_version="$package_version"
              break
            fi
          done <<< "$tags"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$build_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.1
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-release
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libxdo-dev dpkg-dev
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.12.0 --no-progress -y
      - name: Install cargo-packager
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-packager@0.11.8
      - name: Build release workspace
        env:
          # Public verification material is a repository variable, never a
          # signing credential. The trusted stage verifies final signatures.
          EKUBO_UPDATER_PUBLIC_KEY: ${{ vars.EKUBO_UPDATER_PUBLIC_KEY }}
        run: cargo build --locked --release --workspace
      - name: Stage versioned MCP bridge
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          source=target/release/ekubo-wallet-v2-mcp-bridge
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then source="$source.exe"; suffix=.exe; fi
          cp "$source" "target/release/ekubo-wallet-v2-mcp-bridge-${host}${suffix}"
      - name: Build unsigned native packages
        shell: bash
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ vars.EKUBO_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            cargo packager --release --formats app
          else
            export PATH="$PATH:/c/Program Files (x86)/NSIS"
            python contrib/build-v2-packages.py '${{ matrix.formats }}'
          fi
      - name: Verify packaged MCP bridge
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)
              bridge='target/release/Ekubo Wallet 2.app/Contents/MacOS/ekubo-wallet-v2-mcp-bridge'
              test -x "$bridge"
              python3 contrib/verify-mcp-bridge.py "$bridge" "$BUILD_VERSION"
              ;;
            Windows)
              installers=(target/release/*setup.exe)
              test "${#installers[@]}" -eq 1
              mkdir "$RUNNER_TEMP/nsis"
              7z x "-o$RUNNER_TEMP/nsis" "${installers[0]}" >/dev/null
              bridge="$(find "$RUNNER_TEMP/nsis" -name ekubo-wallet-v2-mcp-bridge.exe -print -quit)"
              test -n "$bridge"
              python contrib/verify-mcp-bridge.py "$bridge" "$BUILD_VERSION"
              ;;
            Linux)
              debs=(target/release/*.deb)
              test "${#debs[@]}" -eq 1
              mkdir "$RUNNER_TEMP/deb"
              dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/deb"
              bridge="$(find "$RUNNER_TEMP/deb" -name ekubo-wallet-v2-mcp-bridge -print -quit)"
              test -x "$bridge"
              python3 contrib/verify-mcp-bridge.py "$bridge" "$BUILD_VERSION"
              ;;
          esac
      - name: Install and reinstall actual DEB on disposable runner
        if: runner.os == 'Linux'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS bash contrib/smoke-v2-deb.sh target/release/*.deb
      - name: Build and test native Arch package for Omarchy
        if: runner.os == 'Linux'
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
        run: bash contrib/build-test-arch-ci.sh
      - name: Install and reinstall actual NSIS on disposable runner
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File contrib/smoke-v2-nsis.ps1 -Installer (Get-ChildItem target/release/*setup.exe).FullName
      - name: Stage strict artifact allowlist and manifest
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
          BUILD_SHA: ${{ steps.identity.outputs.commit_sha }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              test -d 'target/release/Ekubo Wallet 2.app'
              tar -C target/release -czf dist/unsigned-macos-app.tar.gz 'Ekubo Wallet 2.app'
              ;;
            Windows)
              installers=(target/release/*setup.exe)
              test "${#installers[@]}" -eq 1
              cp "${installers[0]}" dist/
              7z a dist/windows-payload.zip ./target/release/ekubo-wallet-v2.exe ./target/release/ekubo-wallet-v2-mcp-bridge.exe ./target/release/ekubo-wallet-service.exe ./target/release/ekubo-wallet-v2-enroll.exe ./target/release/ekubo-wallet-v2-owner-auth.exe
              ;;
            Linux)
              debs=(target/release/*.deb)
              test "${#debs[@]}" -eq 1
              cp "${debs[0]}" dist/
              arch_packages=(target/release/*.pkg.tar.zst)
              test "${#arch_packages[@]}" -eq 1
              cp "${arch_packages[0]}" dist/
              ;;
          esac
          node <<'NODE'
          const fs = require('fs'), crypto = require('crypto'), path = require('path');
          const files = fs.readdirSync('dist').sort().map(name => {
            const bytes = fs.readFileSync(path.join('dist', name));
            return {name, size: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex')};
          });
          fs.writeFileSync('dist/manifest.json', JSON.stringify({
            schema: 2, source_ref: process.env.SOURCE_REF, version: process.env.BUILD_VERSION,
            commit_sha: process.env.BUILD_SHA, platform: process.env.BUILD_PLATFORM, files
          }, null, 2) + '\n');
          NODE
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      # This isolated job never checks out or executes the input-selected
      # source. Only it receives the OIDC capability used for attestation.
      - name: Download every unsigned artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-*
          path: unsigned
      - name: Attest exact unsigned files and manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: unsigned/**
