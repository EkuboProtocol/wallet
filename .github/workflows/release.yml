name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude-desktop:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The plugin is published on this release, so it has to name this
      # release. The tag is held to the same version because it, and not
      # Cargo.toml, is what `latest.json` reports to installed wallets.
      - name: Require the plugin and the tag to name this wallet version
        run: contrib/sync-claude-desktop-version.py --check --expect "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/claude-desktop/package-lock.json
      - name: Build Claude Desktop plugin
        working-directory: integrations/claude-desktop
        run: npm ci && npm test && npm run validate:plugin && npm run pack:plugin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-claude-desktop
          path: integrations/claude-desktop/dist/ekubo-wallet-plugin.zip
          if-no-files-found: error

  package:
    permissions:
      contents: read
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            formats: app,dmg
            upload_name: release-packages-macos
          - os: windows-2025
            formats: nsis
            upload_name: unsigned-packages-windows
          - os: ubuntu-24.04
            formats: appimage,deb
            upload_name: release-packages-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfuse2
      - name: Require protected update signing key
        if: runner.os != 'Windows'
        shell: bash
        env:
          EKUBO_UPDATER_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
        run: test -n "$EKUBO_UPDATER_PRIVATE_KEY" && test -n "$EKUBO_UPDATER_PUBLIC_KEY"
      - name: Require embedded updater public key on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
        run: test -n "$EKUBO_UPDATER_PUBLIC_KEY"
      - name: Install cargo-packager
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - name: Configure mandatory Apple signing and notarization submission
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          for value in "$APPLE_CODESIGN_IDENTITY" \
            "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" \
            "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            "$APPLE_NOTARY_API_KEY_P8_BASE64" \
            "$APPLE_NOTARY_ISSUER_ID" \
            "$APPLE_NOTARY_KEY_ID"; do
            test -n "$value"
          done

          keychain_path="$RUNNER_TEMP/ekubo-release-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_password="ekubo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          intermediate=.github/apple/DeveloperIDG2CA.cer
          expected_digest=f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
          actual_digest="$(shasum -a 256 "$intermediate" | cut -d ' ' -f 1)"
          test "$actual_digest" = "$expected_digest"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security import "$intermediate" -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_CODESIGN_IDENTITY"

          # cargo-packager 0.11 only enables signing when the identity is in
          # its macOS config; it does not read an identity environment
          # variable. Append it to this disposable CI checkout, JSON-escaped
          # (a JSON string is also a valid TOML basic string).
          identity="$(ruby -rjson -e 'print ARGV.fetch(0).to_json' "$APPLE_CODESIGN_IDENTITY")"
          printf '\n[package.metadata.packager.macos]\nsigning-identity = %s\n' "$identity" >> Cargo.toml

          printf 'EKUBO_RELEASE_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"
      - name: Build native packages
        if: runner.os != 'Windows'
        shell: bash
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          # cargo-packager 0.11.8 always passes --wait when it can find
          # notarization credentials. It still signs from the macOS config
          # appended above, so keep only notarization auth out of this process
          # and submit the finished DMG explicitly in the next step.
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_KEYCHAIN_PROFILE
          unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          cargo packager --release --formats "${{ matrix.formats }}"
      - name: Build native packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
        run: cargo packager --release --formats "${{ matrix.formats }}"
      - name: Verify Windows application identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "target/release/ekubo-wallet.exe"
          $version = (Get-Item $path).VersionInfo
          if ($version.FileDescription -ne "Ekubo Wallet") {
            throw "Unexpected FileDescription: '$($version.FileDescription)'"
          }
          if ($version.ProductName -ne "Ekubo Wallet") {
            throw "Unexpected ProductName: '$($version.ProductName)'"
          }
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($version.ProductVersion -ne $expectedVersion) {
            throw "Unexpected ProductVersion: '$($version.ProductVersion)', expected '$expectedVersion'"
          }

          $stream = [System.IO.File]::OpenRead($path)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 24 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "Windows executable subsystem is $subsystem, expected 2 (GUI)"
            }
          } finally {
            $stream.Dispose()
          }
      - name: Verify signed macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="target/release/Ekubo Wallet.app"
          shopt -s nullglob
          dmgs=(target/release/*.dmg)
          test "${#dmgs[@]}" -eq 1

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          codesign --verify --strict --verbose=2 "${dmgs[0]}"
          codesign -dv --verbose=4 "${dmgs[0]}" 2>&1 | grep -F 'Authority=Developer ID Application:'
      - name: Submit distributed DMG for notarization without waiting
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/apple-notarization.json"
          shopt -s nullglob
          dmgs=(target/release/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"

          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --no-wait \
            --output-format json > "$response"

          jq -e '.id | type == "string" and length > 0' "$response" >/dev/null
          submission_id="$(jq -r .id "$response")"
          jq . "$response"

          {
            printf '### Apple notarization submitted\n\n'
            printf 'The exact signed DMG published by this release was uploaded successfully; this runner did not wait for the notary service to finish processing it.\n\n'
            printf -- '- Submission ID: **%s**\n\n' "$submission_id"
            printf '    xcrun notarytool info %s --key <AuthKey.p8> --key-id <key-id> --issuer <issuer-id>\n\n' "$submission_id"
            printf 'After acceptance, Gatekeeper can retrieve online tickets for the DMG and its nested app. This release is not stapled, so its first launch requires network access.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$EKUBO_RELEASE_KEYCHAIN" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.upload_name }}
          path: |
            target/release/*.AppImage
            target/release/*.AppImage.sig
            target/release/*.app.tar.gz
            target/release/*.app.tar.gz.sig
            target/release/*.deb
            target/release/*.deb.sig
            target/release/*.dmg
            target/release/*.dmg.sig
            target/release/*.exe
            target/release/*.exe.sig
          if-no-files-found: error

  finalize-windows:
    needs: package
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-packages-windows
          path: dist
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-packager
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - name: Install Minisign verifier
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: minisign@0.7.9
      - name: Capture the pre-Authenticode installer digest
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/*setup.exe)
          if ($installers.Count -ne 1) { throw "expected exactly one Windows installer" }
          (Get-FileHash -Algorithm SHA256 $installers[0].FullName).Hash | Set-Content "$env:RUNNER_TEMP/pre-authenticode.sha256"
      - name: Detect Windows signing configuration
        id: windows-signing
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if ($env:ENDPOINT -and $env:ACCOUNT -and $env:PROFILE -and $env:TENANT -and $env:CLIENT) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output "::notice::Publishing the Windows installer without Authenticode until the Trusted Signing account and profile are configured."
          }
      - name: Apply Authenticode to the Windows installer
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          cache-dependencies: false
      - name: Sign the final Windows installer for the updater
        shell: pwsh
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem dist/*setup.exe)
          if ($installers.Count -ne 1) { throw "expected exactly one Windows installer" }
          Remove-Item -Force -ErrorAction SilentlyContinue "$($installers[0].FullName).sig"
          cargo packager signer sign $installers[0].FullName
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$($installers[0].FullName).sig")) {
            throw "could not sign the final Windows installer for the updater"
          }
      - name: Verify the exact final Windows installer
        shell: pwsh
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem dist/*setup.exe)
          if ($installers.Count -ne 1) { throw "expected exactly one Windows installer" }
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($installers[0].VersionInfo.ProductVersion -ne $expectedVersion) {
            throw "final installer ProductVersion does not match release tag"
          }
          if ('${{ steps.windows-signing.outputs.enabled }}' -eq 'true') {
            $before = (Get-Content "$env:RUNNER_TEMP/pre-authenticode.sha256").Trim()
            $after = (Get-FileHash -Algorithm SHA256 $installers[0].FullName).Hash
            if ($before -eq $after) { throw "Authenticode did not change the installer bytes" }
            $authenticode = Get-AuthenticodeSignature $installers[0].FullName
            if ($authenticode.Status -ne "Valid") { throw "final installer has invalid Authenticode: $($authenticode.Status)" }
          }
          $publicKeyPath = "$env:RUNNER_TEMP/updater.pub"
          $signaturePath = "$env:RUNNER_TEMP/installer.sig"
          [IO.File]::WriteAllBytes($publicKeyPath, [Convert]::FromBase64String($env:EKUBO_UPDATER_PUBLIC_KEY.Trim()))
          $encodedSignature = (Get-Content -Raw "$($installers[0].FullName).sig").Trim()
          [IO.File]::WriteAllBytes($signaturePath, [Convert]::FromBase64String($encodedSignature))
          minisign -Vm $installers[0].FullName -x $signaturePath -p $publicKeyPath
          if ($LASTEXITCODE -ne 0) { throw "final installer has an invalid updater signature" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-windows
          path: |
            dist/*.exe
            dist/*.exe.sig
          if-no-files-found: error

  publish:
    needs: [package, finalize-windows, claude-desktop]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-packages-*
          path: dist
          merge-multiple: true
      - name: Create update metadata
        shell: bash
        run: |
          set -euo pipefail
          macos_bundle="$(find dist -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          windows_bundle="$(find dist -maxdepth 1 -name '*setup.exe' -print -quit)"
          linux_bundle="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          for bundle in "$macos_bundle" "$windows_bundle" "$linux_bundle"; do
            test -n "$bundle"
            test -s "$bundle.sig"
          done

          asset_url() {
            local filename encoded
            filename="$(basename "$1")"
            encoded="$(printf '%s' "$filename" | jq -sRr @uri)"
            printf 'https://github.com/%s/releases/download/%s/%s' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$encoded"
          }

          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg macos_url "$(asset_url "$macos_bundle")" \
            --arg macos_signature "$(cat "$macos_bundle.sig")" \
            --arg macos_sha256 "$(sha256sum "$macos_bundle" | cut -d ' ' -f 1)" \
            --arg windows_url "$(asset_url "$windows_bundle")" \
            --arg windows_signature "$(cat "$windows_bundle.sig")" \
            --arg windows_sha256 "$(sha256sum "$windows_bundle" | cut -d ' ' -f 1)" \
            --arg linux_url "$(asset_url "$linux_bundle")" \
            --arg linux_signature "$(cat "$linux_bundle.sig")" \
            --arg linux_sha256 "$(sha256sum "$linux_bundle" | cut -d ' ' -f 1)" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "macos-aarch64": {url: $macos_url, signature: $macos_signature, sha256: $macos_sha256, format: "app"},
                "windows-x86_64": {url: $windows_url, signature: $windows_signature, sha256: $windows_sha256, format: "nsis"},
                "linux-x86_64": {url: $linux_url, signature: $linux_signature, sha256: $linux_sha256, format: "appimage"}
              }
            }' > dist/latest.json
      - name: Install cargo-packager signer
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - name: Install Minisign verifier
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: minisign@0.7.9
      - name: Sign update metadata and verify every final updater artifact
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          cargo packager signer sign dist/latest.json
          test -s dist/latest.json.sig
          public_key="$RUNNER_TEMP/updater.pub"
          printf '%s' "$EKUBO_UPDATER_PUBLIC_KEY" | base64 --decode > "$public_key"
          for artifact in dist/*.AppImage dist/*.app.tar.gz dist/*setup.exe dist/latest.json; do
            test -s "$artifact"
            test -s "$artifact.sig"
            decoded_signature="$RUNNER_TEMP/$(basename "$artifact").sig"
            base64 --decode < "$artifact.sig" > "$decoded_signature"
            minisign -Vm "$artifact" -x "$decoded_signature" -p "$public_key"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-for-attestation
          path: dist/**
          if-no-files-found: error
          retention-days: 1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: dist/**

  attest:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets-for-attestation
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/**
