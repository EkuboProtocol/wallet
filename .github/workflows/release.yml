name: Release signed binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Match tag, package version, and main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test the tagged source
        run: cargo test --locked --all-features

      - name: Install RustSec audit client
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit dependency advisories
        run: cargo audit

  build-linux:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install target
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          package="ekubo-wallet-${{ needs.validate.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          install -m 0755 "target/${{ matrix.target }}/release/ekubo-wallet" "dist/$package/ekubo-wallet"
          install -m 0755 "target/${{ matrix.target }}/release/ew" "dist/$package/ew"
          install -m 0644 LICENSE "dist/$package/LICENSE"
          install -m 0644 README.md "dist/$package/README.md"
          mkdir -p "dist/$package/completions" "dist/$package/contrib/polkit"
          install -m 0644 completions/* "dist/$package/completions/"
          install -m 0644 contrib/polkit/com.ekubo.wallet.policy "dist/$package/contrib/polkit/"
          cp -R examples schemas "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-native-signing-targets:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install target
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage unsigned binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned/completions
          cp "target/${{ matrix.target }}/release/ekubo-wallet${{ runner.os == 'Windows' && '.exe' || '' }}" unsigned/
          cp "target/${{ matrix.target }}/release/ew${{ runner.os == 'Windows' && '.exe' || '' }}" unsigned/
          cp LICENSE unsigned/LICENSE
          cp README.md unsigned/README.md
          cp completions/* unsigned/completions/
          cp -R examples schemas unsigned/

      - name: Upload unsigned binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: unsigned/
          if-no-files-found: error
          retention-days: 1

  package-macos:
    name: Sign, notarize, and package macOS binaries
    needs: [validate, build-native-signing-targets]
    runs-on: macos-15
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Download Intel binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-x86_64-apple-darwin
          path: unsigned/x86_64-apple-darwin

      - name: Download Apple Silicon binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-aarch64-apple-darwin
          path: unsigned/aarch64-apple-darwin

      # Signing is all-or-nothing: with a complete credential set the binaries
      # are Developer ID signed and notarized, and without any credential the
      # release still publishes, clearly labeled as unsigned. A partial
      # credential set is a configuration error and fails the release.
      - name: Sign, verify, and notarize
        id: sign
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          present=0
          total=0
          for value in "$APPLE_CODESIGN_IDENTITY" \
            "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" \
            "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            "$APPLE_NOTARY_API_KEY_P8_BASE64" \
            "$APPLE_NOTARY_ISSUER_ID" \
            "$APPLE_NOTARY_KEY_ID"; do
            total=$((total + 1))
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "::warning::No Apple signing credentials configured; publishing unsigned macOS binaries."
            printf 'signed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$present" -ne "$total" ]; then
            echo "::error::Apple signing is partially configured ($present of $total secrets)."
            exit 1
          fi
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"

          keychain_path="$RUNNER_TEMP/ekubo-release-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_password="ekubo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$api_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            for name in ekubo-wallet ew; do
              binary="unsigned/$target/$name"
              codesign --force --options runtime --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "$binary"
              codesign --verify --strict --verbose=2 "$binary"
            done
          done
          printf '%s' "$api_key_path" > "$RUNNER_TEMP/notary-key-path"

      - name: Package macOS archives
        shell: bash
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            package="ekubo-wallet-${{ needs.validate.outputs.version }}-$target"
            mkdir -p "dist/$package"
            install -m 0755 "unsigned/$target/ekubo-wallet" "dist/$package/ekubo-wallet"
            install -m 0755 "unsigned/$target/ew" "dist/$package/ew"
            install -m 0644 "unsigned/$target/LICENSE" "dist/$package/LICENSE"
            install -m 0644 "unsigned/$target/README.md" "dist/$package/README.md"
            cp -R "unsigned/$target/completions" "dist/$package/completions"
            cp -R "unsigned/$target/examples" "unsigned/$target/schemas" "dist/$package/"
            ditto -c -k --sequesterRsrc --keepParent "dist/$package" "dist/$package.zip"
            if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
              xcrun notarytool submit "dist/$package.zip" \
                --key "$(cat "$RUNNER_TEMP/notary-key-path")" \
                --key-id "$APPLE_NOTARY_KEY_ID" \
                --issuer "$APPLE_NOTARY_ISSUER_ID" \
                --wait
            fi
          done

      - name: Upload macOS archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Sign and package Windows binary
    needs: [validate, build-native-signing-targets]
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
    outputs:
      signed: ${{ steps.detect.outputs.signed }}
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-x86_64-pc-windows-msvc
          path: unsigned

      - name: Detect Azure signing configuration
        id: detect
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] \
            && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ -n "$AZURE_ARTIFACT_SIGNING_ENDPOINT" ]; then
            printf 'signed=true\n' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Azure Artifact Signing configuration; publishing an unsigned Windows binary."
            printf 'signed=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Azure with OIDC
        if: steps.detect.outputs.signed == 'true'
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign executable
        if: steps.detect.outputs.signed == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\unsigned
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Ekubo Wallet
          description-url: https://github.com/${{ github.repository }}

      - name: Verify and package executable
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ steps.detect.outputs.signed }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:EXPECT_SIGNED -eq "true") {
            foreach ($name in @("ekubo-wallet", "ew")) {
              $signature = Get-AuthenticodeSignature "unsigned\$name.exe"
              if ($signature.Status -ne "Valid") {
                throw "Authenticode verification failed for $name : $($signature.Status)"
              }
            }
          }
          $package = "ekubo-wallet-${{ needs.validate.outputs.version }}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist\$package" | Out-Null
          Copy-Item "unsigned\ekubo-wallet.exe" "dist\$package\ekubo-wallet.exe"
          Copy-Item "unsigned\ew.exe" "dist\$package\ew.exe"
          Copy-Item "unsigned\LICENSE" "dist\$package\LICENSE"
          Copy-Item "unsigned\README.md" "dist\$package\README.md"
          Copy-Item -Recurse "unsigned\completions" "dist\$package\completions"
          Copy-Item -Recurse "unsigned\examples" "dist\$package\examples"
          Copy-Item -Recurse "unsigned\schemas" "dist\$package\schemas"
          Compress-Archive -Path "dist\$package" -DestinationPath "dist\$package.zip"

      - name: Upload Windows archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish immutable release
    needs: [validate, build-linux, package-macos, package-windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive_count=0
          : > SHA256SUMS
          for archive in ekubo-wallet-*; do
            test -f "$archive"
            sha256sum "$archive" >> SHA256SUMS
            archive_count=$((archive_count + 1))
          done
          test "$archive_count" -eq 5

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/ekubo-wallet-* dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done

      - name: Verify Sigstore bundles before publishing
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for artifact in dist/ekubo-wallet-* dist/SHA256SUMS; do
            case "$artifact" in
              *.sigstore.json) continue ;;
            esac
            cosign verify-blob \
              --bundle "$artifact.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$artifact"
          done

      - name: Attest all published files
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*

      - name: Create GitHub Release with attested assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNED: ${{ needs.package-macos.outputs.signed }}
          WINDOWS_SIGNED: ${{ needs.package-windows.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' 'Prebuilt archives are attached below. Every archive and SHA256SUMS carries a keyless Sigstore bundle and a GitHub build-provenance attestation.'
            printf '%s\n' '## Platform code signing'
            if [ "$MACOS_SIGNED" = "true" ]; then
              printf '%s\n' '- macOS: Developer ID signed and notarized.'
            else
              printf '%s\n' '- macOS: **not** Developer ID signed or notarized. Gatekeeper will block the first run until you clear the quarantine attribute (`xattr -d com.apple.quarantine ./ekubo-wallet`). Verify the checksum and Sigstore bundle before doing so.'
            fi
            if [ "$WINDOWS_SIGNED" = "true" ]; then
              printf '%s\n' '- Windows: Authenticode signed with Azure Artifact Signing.'
            else
              printf '%s\n' '- Windows: **not** Authenticode signed. SmartScreen will warn on first run. Verify the checksum and Sigstore bundle before running it.'
            fi
            printf '%s\n' '- Linux: unsigned by platform convention; verify the checksum and Sigstore bundle.'
            printf '\n%s\n' 'Install with:'
            printf '\n%s\n' '```sh'
            printf '%s\n' 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh | sh'
            printf '%s\n\n' '```'
            printf '%s\n' 'Verification instructions: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/releasing.md#verify-a-download'
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Ekubo Wallet ${{ needs.validate.outputs.version }}" \
            --generate-notes \
            --notes-file "$notes"
