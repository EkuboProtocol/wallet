name: Sign and publish release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build unsigned release artifacts run ID
        required: true
        type: string
      tag:
        description: V2 release tag matching the computed build version, such as v2.0.0
        required: true
        type: string

permissions: {}

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    steps:
      # This is the trusted signing-workflow source, never the source selected
      # by the unsigned build. The verifier below therefore executes no bytes
      # from the candidate artifact before establishing its provenance.
      - name: Check out trusted release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the exact build run artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: unsigned-*
          path: unsigned
      - id: verify
        name: Verify attestations, build identity, and every manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          V2_RELEASE_ACCEPTANCE: ${{ vars.V2_RELEASE_ACCEPTANCE }}
        run: |
          set -euo pipefail
          # V2-only channel: v1.* tags never match the v2 regex below and are
          # rejected here. The 1.x line is at 1.8.4 and ships from the
          # release-1.x branch; its update channel (latest.json) is never
          # written by this workflow. See docs/service-isolation.md for the
          # 1.x coexistence statement and the "never upload latest.json"
          # guard in the publish job below.
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]
          # Windows owner authorization is currently fail closed. A maintainer
          # must record native acceptance for this exact candidate SHA first.
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .path <<<"$run")" = '.github/workflows/build-release-artifacts.yml'
          test "$(jq -r .head_branch <<<"$run")" = main
          workflow_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$workflow_sha...main" --jq .status)"
          [[ "$comparison" == ahead || "$comparison" == identical ]]
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/build-release-artifacts.yml"
          mapfile -d '' attested_files < <(find unsigned -type f -print0)
          test "${#attested_files[@]}" -gt 3
          for file in "${attested_files[@]}"; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --signer-digest "$workflow_sha" \
              --source-digest "$workflow_sha" \
              --source-ref refs/heads/main >/dev/null
          done
          manifests=(unsigned/*/manifest.json)
          test "${#manifests[@]}" -eq 3
          platforms="$(jq -r .platform "${manifests[@]}" | sort | paste -sd, -)"
          test "$platforms" = 'linux-x86_64,macos-aarch64,windows-x86_64'
          build_version="$(jq -r .version "${manifests[0]}")"
          build_sha="$(jq -r .commit_sha "${manifests[0]}")"
          test "$V2_RELEASE_ACCEPTANCE" = "$build_sha"
          source_ref="$(jq -r .source_ref "${manifests[0]}")"
          [[ "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$build_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_ref" =~ ^[0-9A-Za-z][0-9A-Za-z._/+@-]{0,254}$ ]]
          test "$RELEASE_TAG" = "v$build_version"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$build_sha" --jq .sha)" = "$build_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$build_sha"
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$build_sha...main" --jq .status)"
          [[ "$comparison" == ahead || "$comparison" == identical ]]
          for manifest in "${manifests[@]}"; do
            jq -e --arg version "$build_version" --arg sha "$build_sha" --arg source_ref "$source_ref" \
              '.schema == 2 and .version == $version and .commit_sha == $sha and .source_ref == $source_ref and (.files | length > 0)' \
              "$manifest" >/dev/null
            directory="$(dirname "$manifest")"
            diff -u \
              <(jq -r '.files[].name' "$manifest" | sort) \
              <(find "$directory" -maxdepth 1 -type f ! -name manifest.json -printf '%f\n' | sort)
            jq -c '.files[]' "$manifest" | while read -r entry; do
              name="$(jq -r .name <<<"$entry")"
              expected_size="$(jq -r .size <<<"$entry")"
              expected_sha="$(jq -r .sha256 <<<"$entry")"
              [[ "$name" != */* && "$name" != .* ]]
              file="$directory/$name"
              test -f "$file"
              test "$(stat -c %s "$file")" = "$expected_size"
              test "$(sha256sum "$file" | cut -d ' ' -f 1)" = "$expected_sha"
            done
          done
          printf 'commit_sha=%s\n' "$build_sha" >> "$GITHUB_OUTPUT"
      - name: Re-upload verified inputs for isolated signing jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-unsigned-inputs
          path: unsigned/**
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    needs: verify-build
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-inputs
          path: input
      - name: Import Apple signing identity
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"; test -n "$CERTIFICATE_PASSWORD"; test -n "$APPLE_CODESIGN_IDENTITY"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$CERTIFICATE" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf 'RELEASE_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Sign app, build DMG and updater tar, notarize DMG
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir work dist
          tar -C work -xzf input/unsigned-macos-aarch64/unsigned-macos-app.tar.gz
          app='work/Ekubo Wallet 2.app'
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          version='${{ inputs.tag }}'; version="${version#v}"
          tar -C work -czf "dist/Ekubo.Wallet.2_${version}_aarch64.app.tar.gz" 'Ekubo Wallet 2.app'
          # Automatic sizing can leave too little space while copying the app.
          # Count logical file bytes and reserve room for filesystem overhead.
          app_bytes="$(python3 -c 'import pathlib, sys; print(sum(p.stat().st_size for p in pathlib.Path(sys.argv[1]).rglob("*") if p.is_file()))' "$app")"
          image_mib=$(( (app_bytes + 1048575) / 1048576 + 64 ))
          hdiutil create -size "${image_mib}m" -volname 'Ekubo Wallet 2' -srcfolder "$app" -ov -format UDZO "dist/Ekubo.Wallet.2_${version}_aarch64.dmg"
          codesign --force --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "dist/Ekubo.Wallet.2_${version}_aarch64.dmg"
          printf '%s' "$APPLE_NOTARY_KEY" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "dist/Ekubo.Wallet.2_${version}_aarch64.dmg" --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
          xcrun stapler staple "dist/Ekubo.Wallet.2_${version}_aarch64.dmg"
      - name: Sign updater artifacts
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-packager@0.11.8
      - shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: for file in dist/*.dmg dist/*.app.tar.gz; do cargo packager signer sign "$file"; done
      - if: always()
        shell: bash
        run: security delete-keychain "$RELEASE_KEYCHAIN" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos
          path: dist/**
          if-no-files-found: error

  sign-windows:
    needs: verify-build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted installer template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-inputs
          path: input
      - name: Stage authenticated payload for inner Authenticode signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $files = @(Get-ChildItem input/unsigned-windows-x86_64/*setup.exe)
          if ($files.Count -ne 1) { throw "expected exactly one installer" }
          New-Item -ItemType Directory target/release -Force | Out-Null
          7z e input/unsigned-windows-x86_64/windows-payload.zip -otarget/release
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified payload.' }
          7z x $files[0].FullName -overified-installer
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect verified installer.' }
          $expected = @('ekubo-wallet-v2.exe', 'ekubo-wallet-v2-mcp-bridge.exe', 'ekubo-wallet-service.exe', 'ekubo-wallet-v2-enroll.exe', 'ekubo-wallet-v2-owner-auth.exe')
          $payload = @(Get-ChildItem target/release -File)
          if ($payload.Count -ne $expected.Count) { throw 'Unexpected payload file count.' }
          foreach ($name in $expected) {
            $candidate = @(Get-ChildItem verified-installer -Recurse -Filter $name)
            if ($candidate.Count -ne 1 -or (Get-FileHash $candidate[0].FullName).Hash -ne (Get-FileHash "target/release/$name").Hash) {
              throw "Payload differs from verified installer: $name"
            }
          }
          foreach ($name in @('install-windows-v2.ps1', 'recover-windows-v2.ps1', 'package-windows-v2.ps1', 'register-windows-v2-auth.ps1')) {
            $candidate = @(Get-ChildItem verified-installer -Recurse -Filter $name)
            if ($candidate.Count -eq 0) { throw "Missing candidate script: $name" }
            foreach ($file in $candidate) {
              if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash "contrib/$name").Hash) {
                throw "Trusted installer script differs from candidate: $name"
              }
            }
          }
          foreach ($file in Get-ChildItem schemas -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path schemas), $file.FullName)
            if ((Get-FileHash "verified-installer/schemas/$relative").Hash -ne (Get-FileHash $file.FullName).Hash) {
              throw "Trusted schema differs from candidate: $relative"
            }
          }
      - name: Require Authenticode for protected v2 enrollment
        shell: pwsh
        env:
          ENABLED: ${{ vars.AZURE_TRUSTED_SIGNING_ENABLED }}
        run: if ($env:ENABLED -ne 'true') { throw 'V2 service payload signing is mandatory.' }
      - name: Authenticate to Azure with GitHub OIDC
        if: vars.AZURE_TRUSTED_SIGNING_ENABLED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign embedded executables and enrollment scripts
        if: vars.AZURE_TRUSTED_SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          files: |
            ${{ github.workspace }}/contrib/install-windows-v2.ps1
            ${{ github.workspace }}/contrib/recover-windows-v2.ps1
            ${{ github.workspace }}/contrib/package-windows-v2.ps1
            ${{ github.workspace }}/contrib/register-windows-v2-auth.ps1
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Rebuild NSIS around signed executable payloads
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          choco install nsis --version=3.12.0 --no-progress -y
          $nsisVersion = & 'C:/Program Files (x86)/NSIS/makensis.exe' /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine NSIS version.' }
          if ("$nsisVersion" -notmatch '3\.12') { throw "Pinned NSIS 3.12.0 required, makensis reported: $nsisVersion" }
          $version = $env:RELEASE_TAG.Substring(1)
          & 'C:/Program Files (x86)/NSIS/makensis.exe' "/DVERSION=$version" contrib/windows-v2.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS rebuild failed.' }
          Copy-Item target/release/*setup.exe dist/
      - name: Sign final NSIS installer
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-packager@0.11.8
      - name: Sign final installer for updater and enforce Authenticode mode
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENABLED: ${{ vars.AZURE_TRUSTED_SIGNING_ENABLED }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = @(Get-ChildItem dist/*setup.exe)
          if ($installer.Count -ne 1) { throw "expected exactly one installer" }
          cargo packager signer sign $installer[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Detached installer signing failed.' }
          if ((Get-AuthenticodeSignature $installer[0]).Status -ne 'Valid') { throw 'Invalid Authenticode signature.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows
          path: dist/**
          if-no-files-found: error

  sign-linux:
    needs: verify-build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-inputs
          path: input
      - shell: bash
        run: |
          mkdir dist
          cp input/unsigned-linux-x86_64/*.deb dist/
          cp input/unsigned-linux-x86_64/*.pkg.tar.zst dist/
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-packager@0.11.8
      - name: Sign Linux updater artifacts
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: for file in dist/*.deb dist/*.pkg.tar.zst; do cargo packager signer sign "$file"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-linux
          path: dist/**
          if-no-files-found: error

  final-artifact-smoke:
    # Execute candidate installers only on fresh runners without release secrets,
    # environment approval credentials, Azure login state, or OIDC permission.
    needs: [sign-macos, sign-windows, sign-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: signed-linux
          - os: windows-2025
            artifact: signed-windows
          - os: macos-15
            artifact: signed-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - if: runner.os == 'Linux'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS bash contrib/smoke-v2-deb.sh dist/*.deb
      - if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File contrib/smoke-v2-nsis.ps1 -Installer (Get-ChildItem dist/*setup.exe).FullName -RequireSignature
      - if: runner.os == 'macOS'
        run: bash contrib/smoke-v2-dmg.sh dist/*.dmg

  publish:
    needs: [verify-build, final-artifact-smoke]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Enforce final asset allowlist and create metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in dist/*' '*; do
            mv "$file" "${file// /.}"
          done
          assets=(dist/*)
          test "${#assets[@]}" -eq 10
          find dist -maxdepth 1 -type f -printf '%f\n' | while read -r name; do
            [[ "$name" =~ ^Ekubo\.Wallet\.2_2\.[0-9.]+_aarch64\.(dmg|app\.tar\.gz)(\.sig)?$ \
              || "$name" =~ ^ekubo-wallet-v2_2\.[0-9.]+_x64-setup\.exe(\.sig)?$ \
              || "$name" =~ ^ekubo-wallet-v2_2\.[0-9.]+_amd64\.deb(\.sig)?$ \
              || "$name" =~ ^ekubo-wallet-v2-2\.[0-9.]+-1-x86_64\.pkg\.tar\.zst(\.sig)?$ ]]
          done
          macos_bundles=(dist/*.app.tar.gz)
          windows_bundles=(dist/*setup.exe)
          linux_bundles=(dist/*.deb)
          arch_bundles=(dist/*.pkg.tar.zst)
          test "${#macos_bundles[@]}" -eq 1
          test "${#windows_bundles[@]}" -eq 1
          test "${#linux_bundles[@]}" -eq 1
          test "${#arch_bundles[@]}" -eq 1
          macos_bundle="${macos_bundles[0]}"
          windows_bundle="${windows_bundles[0]}"
          linux_bundle="${linux_bundles[0]}"
          arch_bundle="${arch_bundles[0]}"
          for bundle in "$macos_bundle" "$windows_bundle" "$linux_bundle" "$arch_bundle"; do test -s "$bundle"; test -s "$bundle.sig"; done
          url() { printf 'https://github.com/%s/releases/download/%s/%s' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$(printf '%s' "$(basename "$1")" | jq -sRr @uri)"; }
          jq -n --arg version "${RELEASE_TAG#v}" --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg mu "$(url "$macos_bundle")" --arg ms "$(cat "$macos_bundle.sig")" --arg mh "$(sha256sum "$macos_bundle" | cut -d ' ' -f 1)" \
            --arg wu "$(url "$windows_bundle")" --arg ws "$(cat "$windows_bundle.sig")" --arg wh "$(sha256sum "$windows_bundle" | cut -d ' ' -f 1)" \
            --arg lu "$(url "$linux_bundle")" --arg ls "$(cat "$linux_bundle.sig")" --arg lh "$(sha256sum "$linux_bundle" | cut -d ' ' -f 1)" \
            --arg au "$(url "$arch_bundle")" --arg as "$(cat "$arch_bundle.sig")" --arg ah "$(sha256sum "$arch_bundle" | cut -d ' ' -f 1)" \
            '{product:"org.ekubo.wallet.v2",channel:"v2",version:$version,pub_date:$pub_date,platforms:{"macos-aarch64":{url:$mu,signature:$ms,sha256:$mh,format:"app"}},manual_installers:{"windows-x86_64":{url:$wu,signature:$ws,sha256:$wh,format:"nsis"},"linux-x86_64":{url:$lu,signature:$ls,sha256:$lh,format:"deb"},"linux-x86_64-arch":{url:$au,signature:$as,sha256:$ah,format:"pacman"}}}' > dist/latest-v2.json
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-packager@0.11.8
      - name: Sign metadata
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: cargo packager signer sign dist/latest-v2.json
      - name: Create release at the verified build SHA and upload exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_body='Ekubo Wallet 2 is a separate fresh-install product. Linux and Windows require protected service enrollment and signed installer updates. Existing 1.x wallets are not migrated. See the v2 installation and acceptance documentation.'
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" -f name="$RELEASE_TAG" \
            -f body="$release_body" \
            -f make_latest=false \
            -F prerelease="$( [[ "$RELEASE_TAG" == *-* ]] && echo true || echo false )" > release.json
          upload_url="$(jq -r '.upload_url | sub("\\{.*"; "")' release.json)"
          for file in dist/*; do
            encoded="$(printf '%s' "$(basename "$file")" | jq -sRr @uri)"
            gh api --method POST "$upload_url?name=$encoded" --input "$file" -H 'Content-Type: application/octet-stream'
          done
          # A separate, explicitly non-latest release is the v2 discovery channel.
          # Never upload latest.json or mutate the 1.x latest release.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2-channel" > channel.json; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=v2-channel -f target_commitish='${{ needs.verify-build.outputs.commit_sha }}' \
              -f name='Ekubo Wallet 2 update channel' -f make_latest=false -F prerelease=true > channel.json
          fi
          channel_id="$(jq -r .id channel.json)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$channel_id" -f make_latest=false -F prerelease=true >/dev/null
          gh release upload v2-channel dist/latest-v2.json dist/latest-v2.json.sig --clobber
      - name: Assert the new tag is not the repository latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only make_latest=false keeps the numeric-compare 1.x updater off
          # v2 tags. Fail closed: any mismatch or lookup failure blocks here.
          test "$(gh release view "$RELEASE_TAG" --json isLatest --jq .isLatest)" = false
