name: Release desktop applications

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
      - run: cargo fmt --all --check
      - name: Run release validation tests
        # GPUI's dependency graph plus two workspace test harnesses exhausted
        # the Ubuntu runner while rust-lld was writing full debuginfo. Release
        # validation needs assertions and overflow checks, not debug symbols.
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          RUST_MIN_STACK: 67108864
          RUSTFLAGS: -D warnings
        run: cargo test --locked --workspace
      - run: contrib/generate-third-party-licenses.py --check
      - run: cargo tree --locked | (! grep -E ' (clap|clap_complete|crossterm|ratatui) v')
      - run: '! grep -R "transport-io" Cargo.toml Cargo.lock'

  package:
    needs: validate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            formats: app,dmg
            artifact: macos
          - os: windows-2025
            formats: nsis
            artifact: windows
          - os: ubuntu-24.04
            formats: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfuse2
      - name: Require protected update signing key
        shell: bash
        env:
          EKUBO_UPDATER_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
        run: test -n "$EKUBO_UPDATER_PRIVATE_KEY" && test -n "$EKUBO_UPDATER_PUBLIC_KEY"
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build native packages
        shell: bash
        env:
          EKUBO_UPDATER_PUBLIC_KEY: ${{ secrets.EKUBO_UPDATER_PUBLIC_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_NOTARY_KEY_PATH }}
        run: cargo packager --release --formats "${{ matrix.formats }}"
      - name: Sign Windows installer
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.artifact }}
          path: target/release/bundle/**
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Install cargo-packager signer
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Sign update metadata
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: cargo packager signer sign dist/latest.json
      - name: Require signed update metadata
        run: test -f dist/latest.json && test -f dist/latest.json.sig && find dist -name '*.sig' -print -quit | grep .
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: dist/**
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/**
