name: Sign and publish release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build unsigned release artifacts run ID
        required: true
        type: string
      tag:
        description: Release tag matching the computed build version, such as v1.2.3
        required: true
        type: string

permissions: {}

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
    steps:
      - name: Download the exact build run artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: unsigned-*
          path: unsigned
      - id: verify
        name: Verify build workflow identity and every manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .path <<<"$run")" = '.github/workflows/build-release-artifacts.yml'
          test "$(jq -r .head_branch <<<"$run")" = main
          workflow_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$workflow_sha...main" --jq .status)"
          [[ "$comparison" == ahead || "$comparison" == identical ]]
          manifests=(unsigned/*/manifest.json)
          test "${#manifests[@]}" -eq 3
          platforms="$(jq -r .platform "${manifests[@]}" | sort | paste -sd, -)"
          test "$platforms" = 'linux-x86_64,macos-aarch64,windows-x86_64'
          build_version="$(jq -r .version "${manifests[0]}")"
          build_sha="$(jq -r .commit_sha "${manifests[0]}")"
          source_ref="$(jq -r .source_ref "${manifests[0]}")"
          [[ "$build_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$build_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_ref" =~ ^[0-9A-Za-z][0-9A-Za-z._/+@-]{0,254}$ ]]
          test "$RELEASE_TAG" = "v$build_version"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$build_sha" --jq .sha)" = "$build_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$build_sha"
          for manifest in "${manifests[@]}"; do
            jq -e --arg version "$build_version" --arg sha "$build_sha" --arg source_ref "$source_ref" \
              '.schema == 2 and .version == $version and .commit_sha == $sha and .source_ref == $source_ref and (.files | length > 0)' \
              "$manifest" >/dev/null
            directory="$(dirname "$manifest")"
            diff -u \
              <(jq -r '.files[].name' "$manifest" | sort) \
              <(find "$directory" -maxdepth 1 -type f ! -name manifest.json -printf '%f\n' | sort)
            jq -c '.files[]' "$manifest" | while read -r entry; do
              name="$(jq -r .name <<<"$entry")"
              expected_size="$(jq -r .size <<<"$entry")"
              expected_sha="$(jq -r .sha256 <<<"$entry")"
              [[ "$name" != */* && "$name" != .* ]]
              file="$directory/$name"
              test -f "$file"
              test "$(stat -c %s "$file")" = "$expected_size"
              test "$(sha256sum "$file" | cut -d ' ' -f 1)" = "$expected_sha"
            done
          done
          printf 'commit_sha=%s\n' "$build_sha" >> "$GITHUB_OUTPUT"
      - name: Re-upload verified inputs for isolated signing jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-unsigned-inputs
          path: unsigned/**
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    needs: verify-build
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-inputs
          path: input
      - name: Import Apple signing identity
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE"; test -n "$CERTIFICATE_PASSWORD"; test -n "$APPLE_CODESIGN_IDENTITY"
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$CERTIFICATE" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf 'RELEASE_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Sign app, build DMG and updater tar, notarize DMG
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir work dist
          tar -C work -xzf input/unsigned-macos-aarch64/unsigned-macos-app.tar.gz
          app='work/Ekubo Wallet.app'
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          version='${{ inputs.tag }}'; version="${version#v}"
          tar -C work -czf "dist/Ekubo.Wallet_${version}_aarch64.app.tar.gz" 'Ekubo Wallet.app'
          hdiutil create -volname 'Ekubo Wallet' -srcfolder "$app" -ov -format UDZO "dist/Ekubo.Wallet_${version}_aarch64.dmg"
          codesign --force --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "dist/Ekubo.Wallet_${version}_aarch64.dmg"
          printf '%s' "$APPLE_NOTARY_KEY" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "dist/Ekubo.Wallet_${version}_aarch64.dmg" --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
          xcrun stapler staple "dist/Ekubo.Wallet_${version}_aarch64.dmg"
      - name: Sign updater artifacts
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: for file in dist/*.dmg dist/*.app.tar.gz; do cargo packager signer sign "$file"; done
      - if: always()
        shell: bash
        run: security delete-keychain "$RELEASE_KEYCHAIN" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos
          path: dist/**
          if-no-files-found: error

  sign-windows:
    needs: verify-build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-inputs
          path: input
      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $files = @(Get-ChildItem input/unsigned-windows-x86_64/*setup.exe)
          if ($files.Count -ne 1) { throw "expected exactly one installer" }
          Copy-Item $files[0].FullName dist/
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply mandatory Authenticode
        uses: azure/trusted-signing-action@0d74250c661747df006298d0fb49944c10f16e03 # v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - name: Sign final installer for updater
        shell: pwsh
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = @(Get-ChildItem dist/*setup.exe)
          if ($installer.Count -ne 1) { throw "expected exactly one installer" }
          cargo packager signer sign $installer[0].FullName
          if ((Get-AuthenticodeSignature $installer[0]).Status -ne 'Valid') { throw 'invalid Authenticode signature' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows
          path: dist/**
          if-no-files-found: error

  sign-linux:
    needs: verify-build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-unsigned-inputs
          path: input
      - shell: bash
        run: mkdir dist && cp input/unsigned-linux-x86_64/*.AppImage input/unsigned-linux-x86_64/*.deb dist/
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - name: Sign Linux updater artifacts
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: for file in dist/*.AppImage dist/*.deb; do cargo packager signer sign "$file"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-linux
          path: dist/**
          if-no-files-found: error

  publish:
    needs: [verify-build, sign-macos, sign-windows, sign-linux]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Enforce final asset allowlist and create metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in dist/*' '*; do
            mv "$file" "${file// /.}"
          done
          assets=(dist/*)
          test "${#assets[@]}" -eq 10
          find dist -maxdepth 1 -type f -printf '%f\n' | while read -r name; do
            [[ "$name" =~ ^Ekubo\.Wallet_[0-9A-Za-z.+-]+_aarch64\.(dmg|app\.tar\.gz)(\.sig)?$ \
              || "$name" =~ ^ekubo-wallet_[0-9A-Za-z.+-]+_x64-setup\.exe(\.sig)?$ \
              || "$name" =~ ^ekubo-wallet_[0-9A-Za-z.+-]+_(x86_64\.AppImage|amd64\.deb)(\.sig)?$ ]]
          done
          macos_bundles=(dist/*.app.tar.gz)
          windows_bundles=(dist/*setup.exe)
          linux_bundles=(dist/*.AppImage)
          test "${#macos_bundles[@]}" -eq 1
          test "${#windows_bundles[@]}" -eq 1
          test "${#linux_bundles[@]}" -eq 1
          macos_bundle="${macos_bundles[0]}"
          windows_bundle="${windows_bundles[0]}"
          linux_bundle="${linux_bundles[0]}"
          for bundle in "$macos_bundle" "$windows_bundle" "$linux_bundle"; do test -s "$bundle"; test -s "$bundle.sig"; done
          url() { printf 'https://github.com/%s/releases/download/%s/%s' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$(printf '%s' "$(basename "$1")" | jq -sRr @uri)"; }
          jq -n --arg version "${RELEASE_TAG#v}" --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg mu "$(url "$macos_bundle")" --arg ms "$(cat "$macos_bundle.sig")" --arg mh "$(sha256sum "$macos_bundle" | cut -d ' ' -f 1)" \
            --arg wu "$(url "$windows_bundle")" --arg ws "$(cat "$windows_bundle.sig")" --arg wh "$(sha256sum "$windows_bundle" | cut -d ' ' -f 1)" \
            --arg lu "$(url "$linux_bundle")" --arg ls "$(cat "$linux_bundle.sig")" --arg lh "$(sha256sum "$linux_bundle" | cut -d ' ' -f 1)" \
            '{version:$version,pub_date:$pub_date,platforms:{"macos-aarch64":{url:$mu,signature:$ms,sha256:$mh,format:"app"},"windows-x86_64":{url:$wu,signature:$ws,sha256:$wh,format:"nsis"},"linux-x86_64":{url:$lu,signature:$ls,sha256:$lh,format:"appimage"}}}' > dist/latest.json
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-packager@0.11.8
      - name: Sign metadata
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.EKUBO_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: cargo packager signer sign dist/latest.json
      - name: Create release at the verified build SHA and upload exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-build.outputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_SHA" \
            -f name="$RELEASE_TAG" -F prerelease="$( [[ "$RELEASE_TAG" == *-* ]] && echo true || echo false )" > release.json
          upload_url="$(jq -r '.upload_url | sub("\\{.*"; "")' release.json)"
          for file in dist/*; do
            encoded="$(printf '%s' "$(basename "$file")" | jq -sRr @uri)"
            gh api --method POST "$upload_url?name=$encoded" --input "$file" -H 'Content-Type: application/octet-stream'
          done
