name: Live network matrix

# The wallet's chain-facing behaviour is supposed to be identical on every
# default network, and only a real RPC can prove that. These tests are kept out
# of the pull-request workflow because they depend on shared public endpoints;
# they run on a schedule and on demand instead, so a chain that starts behaving
# differently is caught without making every PR depend on third-party uptime.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-networks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Live RPC conformance
    runs-on: ubuntu-24.04
    env:
      # No per-chain overrides: this job exists to prove the endpoints that
      # actually ship still work.
      EKUBO_WALLET_LIVE_RPC_TESTS: "1"
      # The RPC assertions need overflow checks, not debug symbols. Keeping
      # these artifacts small prevents the GPUI dependency graph from
      # exhausting the hosted runner while linking the follow-up unit test.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest stable Rust
        run: rustup update stable --no-self-update

      - name: Install GPUI and tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Preserve the expensive native build when a public endpoint is the
          # thing that failed, so a diagnostic rerun reaches RPCs quickly.
          cache-on-failure: true

      - name: Run the live network matrix
        # One chain at a time: the shared endpoints throttle a parallel run,
        # and a throttled retry loop is slower than running serially.
        run: cargo test --locked --all-features --test live_networks -- --nocapture --test-threads=1

      - name: Run the ignored live unit tests
        # Restrict Cargo to the library harness. A name filter alone also
        # links every unrelated integration-test binary before filtering it.
        run: cargo test --locked --all-features --lib live_ -- --ignored --nocapture
