<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet2.Provision"/>
    <!-- Supported by dbus-broker 37 as well as dbus-daemon. Deny the
         privileged interfaces independently of destination (including unique
         names); only root receives the exact typed method routes below. -->
    <deny send_interface="org.ekubo.Wallet2.Provision1"/>
    <deny send_interface="org.ekubo.Wallet2.InstallerRelay1"/>
  </policy>
  <policy user="root">
    <!-- The installer verifies and pins the service UID/unique name; the
         service and owner relay independently require the sender UID to be 0.
         These routes do not authenticate a destination or grant introspection. -->
    <allow send_type="method_call" send_path="/org/ekubo/Wallet2/Provision"
           send_interface="org.ekubo.Wallet2.Provision1" send_member="Enroll"/>
    <allow send_type="method_call" send_path="/org/ekubo/Wallet2/InstallerRelay"
           send_interface="org.ekubo.Wallet2.InstallerRelay1" send_member="Persist"/>
  </policy>
  <policy user="ekubo-wallet-v2">
    <allow own_prefix="org.ekubo.Wallet2.Provision"/>
  </policy>
</busconfig>
