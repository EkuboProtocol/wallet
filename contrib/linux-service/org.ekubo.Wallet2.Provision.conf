<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet2.Provision"/>
    <deny send_destination_prefix="org.ekubo.Wallet2.Provision"/>
    <deny send_interface="org.ekubo.Wallet2.InstallerRelay1"/>
  </policy>
  <policy user="root">
    <allow send_destination_prefix="org.ekubo.Wallet2.Provision"/>
    <allow send_type="method_call" send_path="/org/ekubo/Wallet2/InstallerRelay"
           send_interface="org.ekubo.Wallet2.InstallerRelay1" send_member="Persist"/>
  </policy>
  <policy user="ekubo-wallet-v2">
    <allow own_prefix="org.ekubo.Wallet2.Provision"/>
  </policy>
</busconfig>
