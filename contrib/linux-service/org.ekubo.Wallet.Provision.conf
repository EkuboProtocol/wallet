<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet.Provision"/>
    <deny send_destination_prefix="org.ekubo.Wallet.Provision"/>
    <deny send_interface="org.ekubo.Wallet.InstallerRelay1"/>
  </policy>
  <policy user="root">
    <allow send_destination_prefix="org.ekubo.Wallet.Provision"/>
    <!-- The owner endpoint has only a unique bus name. Its handler also checks
         the actual sender UID before parsing or accessing the login keyring. -->
    <allow send_type="method_call"
           send_path="/org/ekubo/Wallet/InstallerRelay"
           send_interface="org.ekubo.Wallet.InstallerRelay1"
           send_member="Persist"/>
  </policy>
  <policy user="ekubo-wallet">
    <allow own_prefix="org.ekubo.Wallet.Provision"/>
  </policy>
</busconfig>
