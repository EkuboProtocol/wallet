<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet.Provision"/>
    <deny send_destination_prefix="org.ekubo.Wallet.Provision"/>
  </policy>
  <policy user="root">
    <allow send_destination_prefix="org.ekubo.Wallet.Provision"/>
  </policy>
  <policy user="ekubo-wallet">
    <allow own_prefix="org.ekubo.Wallet.Provision"/>
  </policy>
</busconfig>
