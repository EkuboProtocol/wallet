<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet.Owner"/>
    <!-- Core verifies the actual sender UID on every owner method. Bus policy
         routes calls; it does not grant signing or owner authorization. -->
    <allow send_destination_prefix="org.ekubo.Wallet.Owner"/>
  </policy>
  <policy user="ekubo-wallet">
    <allow own_prefix="org.ekubo.Wallet.Owner"/>
  </policy>
</busconfig>
