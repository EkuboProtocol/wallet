<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet2.Owner"/>
    <!-- Core verifies the actual sender UID on every owner method. Bus policy
         routes calls; it does not grant signing or owner authorization. -->
    <allow send_destination_prefix="org.ekubo.Wallet2.Owner"/>
  </policy>
  <policy user="ekubo-wallet-v2">
    <allow own_prefix="org.ekubo.Wallet2.Owner"/>
    <allow send_type="signal" send_interface="org.ekubo.Wallet2.Owner1"
           send_member="DesktopSessionReady" send_path="/org/ekubo/Wallet2/Owner"/>
  </policy>
</busconfig>
