<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.ekubo.Wallet2.Owner"/>
    <!-- dbus-broker 37 cannot match destination prefixes. Clients activate via
         the bus registry, authenticate the service UID, then pin its unique
         name. Route only the typed methods at their exact interface/path;
         this is not a destination identity check. Core verifies the actual
         sender UID and owner authorization. No generic introspection grant. -->
    <allow send_type="method_call" send_interface="org.ekubo.Wallet2.Owner1"
           send_path="/org/ekubo/Wallet2/Owner" send_member="Call"/>
    <allow send_type="method_call" send_interface="org.ekubo.Wallet2.Owner1"
           send_path="/org/ekubo/Wallet2/Owner" send_member="LegacyMove"/>
    <allow send_type="method_call" send_interface="org.ekubo.Wallet2.Owner1"
           send_path="/org/ekubo/Wallet2/Owner" send_member="HoldDesktopSession"/>
    <allow send_type="method_call" send_interface="org.ekubo.Wallet2.Custody1"
           send_path="/org/ekubo/Wallet2/Custody" send_member="Unlock"/>
  </policy>
  <policy user="ekubo-wallet-v2">
    <allow own_prefix="org.ekubo.Wallet2.Owner"/>
    <allow send_type="signal" send_interface="org.ekubo.Wallet2.Owner1"
           send_member="DesktopSessionReady" send_path="/org/ekubo/Wallet2/Owner"/>
  </policy>
</busconfig>
